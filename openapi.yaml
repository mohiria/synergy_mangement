      operationId: createTaskInvites
      tags: [task-invites]
      summary: 邀请成员为某个 KR 创建任务（KR 负责人／项目管理员／项目负责人；可多选受邀成员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInvitesRequest"
      responses:
        "201":
          description: 已发出，返回项目最新的完整邀请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/task-invites/{inviteId}/revoke:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: inviteId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: revokeTaskInvite
      tags: [task-invites]
      summary: 撤回待处理的任务创建邀请（邀请人／项目管理员／项目负责人）
      responses:
        "200":
          description: 已撤回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: 全部用户（用于人员选择）
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  responses:
    Unauthorized:
      description: 未登录或会话已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 登录失败次数过多，暂时限速
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: 请求内容未通过校验
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 当前用户无权执行该动作（动作权限按成员角色在 domain 层统一判定）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与现有资源状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
        message:
          type: string
          description: 面向用户的错误说明
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          format: password
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: 新口令，至少 8 位且不能与当前口令相同
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
    CurrentUser:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
    UserSummary:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
    ProjectStatus:
      type: string
      description: 项目状态（未开始／进行中／已完成／已归档），与自由文本“阶段”正交
      enum: [not_started, in_progress, completed, archived]
    MemberRole:
      type: string
      description: 成员角色（项目管理员／项目成员／访客），见词汇表「成员角色」
      enum: [admin, member, viewer]
    ProjectMember:
      type: object
      required: [userId, username, displayName, role]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        roleLabel:
          type: string
          description: 成员角色显示文案（派生字段；前端不按枚举拼文案）
    AddProjectMembersRequest:
      type: object
      required: [userIds, role]
      properties:
        userIds:
          type: array
          minItems: 1
          description: 本次加入的用户 id 名单，全部赋予同一个成员角色；重复的 id 只算一次
          items:
            type: integer
            format: int64
        role:
          $ref: "#/components/schemas/MemberRole"
    AddProjectMembersResult:
      type: object
      required: [added, skipped]
      description: 一次批量加入的逐人结果
      properties:
        added:
          type: array
          description: 本次新建立成员关系的人
          items:
            $ref: "#/components/schemas/ProjectMember"
        skipped:
          type: array
          description: 未加入的人及原因
          items:
            $ref: "#/components/schemas/SkippedMember"
    SkippedMember:
      type: object
      required: [userId, reason, reasonLabel]
      properties:
        userId:
          type: integer
          format: int64
        displayName:
          type: string
          description: 用户姓名；用户不存在时缺省
        reason:
          type: string
          description: 跳过原因枚举
          enum: [already_member, user_not_found]
        reasonLabel:
          type: string
          description: 跳过原因显示文案（派生字段；前端不按枚举拼文案）
    UpdateProjectMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"
    RiskLevel:
      type: string
      description: 风险等级（正常／预警／高风险），见词汇表「风险等级」；读时派生值，不落库、无写入路径（KR 取「下级任务未解除卡点最高等级、超期、临期」的最大值，PRD §5.7）
      enum: [normal, warning, high_risk]
    KeyResult:
      type: object
      required: [id, objectiveId, code, description, riskLevel, riskLevelLabel, sortOrder]
      properties:
        id:
          type: integer
          format: int64
        objectiveId:
          type: integer
          format: int64
        code:
          type: string
          description: KR 展示编号，形如 KR1.1（AC-64；创建时分配并持久保存）
        riskLevelLabel:
          type: string
          description: 风险等级显示文案（派生字段；与 statusLabel／kindLabel 同惯例，前端不按枚举拼文案）
        description:
          type: string
          description: KR 描述
        metric:
          type: string
          description: 量化指标，选填
        ownerId:
          type: integer
          format: int64
          description: KR 负责人（项目成员，选填；工作职责而非权限级别）
        ownerName:
          type: string
          description: KR 负责人姓名（派生字段）
        startDate:
          type: string
          format: date
          description: 周期开始日期
        endDate:
          type: string
          format: date
          description: 周期截止日期
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        sortOrder:
          type: integer
        progressSummary:
          $ref: "#/components/schemas/ProgressSummary"
        riskNote:
          type: string
          description: 预警／高风险的一行原因（派生字段；与 riskLevel 同源，来自抬高等级的那条卡点或临期／超期事实。正常态不返回，AC-05）
        openBlockerCount:
          type: integer
          description: KR 下任务的派生卡点数量（派生字段；图谱 KR 节点展示，AC-08）
        taskCount:
          type: integer
          description: KR 下任务数量（派生字段；OKR 表「任务」列，含已完成与已取消，AC-65）
        canEdit:
          type: boolean
          description: 当前用户能否编辑本 KR（派生字段；项目管理员或本 KR 负责人，AC-65）
        canDelete:
          type: boolean
          description: 当前用户能否删除本 KR（派生字段；仅项目管理员且 KR 下无任务，AC-65）
    ImpactedTarget:
      type: object
      description: 一条受影响的 O／KR（系统推导，协作关系 PRD §8.1）
      required: [keyResultId, krDescription, objectiveId, objectiveTitle]
      properties:
        keyResultId:
          type: integer
          format: int64
        krDescription:
          type: string
        objectiveId:
          type: integer
          format: int64
        objectiveTitle:
          type: string
    ProgressSummary:
      type: object
      description: >-
        KR 层进度汇总与数据覆盖度（词汇表「进度数据覆盖度」；AC-63）：统计已入池且未取消的任务，
        已取消整体剔除；平均值任务等权、未填按 0 计入、已完成按 100
      required: [totalTasks, filledTasks]
      properties:
        totalTasks:
          type: integer
          description: 参与汇总的任务数（已入池且未取消），即平均值的分母
        filledTasks:
          type: integer
          description: 其中由负责人真实填写进度的任务数（已完成计入），说明平均值里有多少来自真实填写
        averageProgress:
          type: integer
          description: 任务等权平均（四舍五入）；未填按 0、已完成按 100 计入。没有参与汇总的任务时不返回
    UpdateTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress]
          description: 手工流转目标：开始执行（未开始／等待输入 → 进行中）；取消走 /cancellation（AC-57）
    TaskCancellationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 取消原因，必填（AC-57）
    UpdateTaskProgressRequest:
      type: object
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 省略或 null 表示清除进度，回到只展示状态
    Objective:
      type: object
      required: [id, projectId, code, title, sortOrder, keyResults, riskLevel, riskLevelLabel]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          description: O 展示编号，自然数形如 O1（AC-64；创建时分配并持久保存，删除同级对象后不重排）
        projectId:
          type: integer
          format: int64
        title:
          type: string
          description: O 标题
        description:
          type: string
          description: O 说明，选填
        sortOrder:
          type: integer
        keyResults:
          type: array
          items:
            $ref: "#/components/schemas/KeyResult"
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
          description: >-
            O 的风险等级（**只读派生字段，接口不接受写入**；AC-59、§5.7）：只取下级 KR 风险的
            最大值，不叠加 O 自身的临期与超期
        riskLevelLabel:
          type: string
          description: 风险等级显示文案（派生字段）
        riskNote:
          type: string
          description: 风险原因一行（派生字段，与等级同源；正常时不返回）
        canEdit:
          type: boolean
          description: 当前用户能否编辑本 O（派生字段；仅项目管理员，AC-65）
        canDelete:
          type: boolean
          description: 当前用户能否删除本 O（派生字段；仅项目管理员且 O 下无 KR，AC-65）
    UpdateObjectiveRequest:
      type: object
      description: 编辑 O（AC-65）：只传要改的字段
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    UpdateKeyResultRequest:
      type: object
      description: 编辑 KR（AC-61、AC-65）：只传要改的字段；ownerId 不可置空
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          type: string
          maxLength: 100
        ownerId:
          type: integer
          format: int64
          description: 新的 KR 负责人（非只读项目成员）；不可置空
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        transferPendingApprovals:
          type: boolean
          default: true
          description: >-
            更换负责人时是否把该 KR 下的未决审批单转交继任者（AC-61）。
            默认转交并向继任者发站内通知；取消勾选则保留给原负责人处理
    KrHandoverPreview:
      type: object
      description: 更换 KR 负责人前的确认信息（AC-61）：该 KR 下当前有多少未决审批单
      required: [pendingApprovals]
      properties:
        pendingApprovals:
          type: integer
          description: 待入池审批、待处理变更单与待终审完成申请的合计条数
    CreateKeyResultInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          type: string
          maxLength: 100
        ownerId:
          type: integer
          format: int64
          description: KR 负责人，必须是项目成员
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    CreateOkrBatchItem:
      type: object
      description: 二选一：填 title（可带 description）新建 O，或填 objectiveId 向已有 O 追加 KR（此时 keyResults 至少一条）
      properties:
        objectiveId:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        keyResults:
          type: array
          items:
            $ref: "#/components/schemas/CreateKeyResultInput"
    CreateOkrBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOkrBatchItem"
    TaskStatus:
      type: string
      description: 任务生命周期状态（词汇表「任务生命周期状态」）；页面主状态汇总，审批原始状态在审批单中
      enum:
        [
          draft,
          pending_pool_review,
          not_started,
          waiting_input,
          in_progress,
          pending_intermediate_review,
          pending_final_review,
          completed,
          cancelled,
        ]
    ResultUpdateState:
      type: string
      description: >-
        成果更新进程（词汇表「成果更新」；派生自任务事实，接口不接受直接写入）：
        none＝无；open＝已发起、候选内容尚未随完成申请提交；reviewing＝已提交，或签或 KR 终审在审。
        整个过程中任务生命周期状态保持 completed
      enum: [none, open, reviewing]
    PoolReviewStatus:
      type: string
      description: 入池审批单状态（词汇表「入池审批单」）；未提交即无审批单
      enum: [pending, approved, rejected]
    PoolReview:
      type: object
      description: 任务最近一次入池审批单
      required: [status, statusLabel, exempt]
      properties:
        status:
          $ref: "#/components/schemas/PoolReviewStatus"
        statusLabel:
          type: string
          description: 面向用户的显示文案（AC-04；派生字段）：待审批为“待{所属 KR 负责人姓名}审批”，免审为“免审通过”，其余为“已通过／已退回”
        exempt:
          type: boolean
          description: KR 负责人本人创建免审时由系统自动生成并标记（AC-26）
        opinion:
          type: string
          description: 审批意见；免审时为系统记录的免审原因
        submittedByName:
          type: string
          description: 提交人姓名（派生字段）
        decidedByName:
          type: string
          description: 处理人姓名（派生字段）
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
    Task:
      type: object
      required:
        [
          id,
          keyResultId,
          code,
          name,
          ownerId,
          ownerName,
          startDate,
          endDate,
          updatedAt,
          status,
          statusLabel,
          currentStage,
          canProposeFieldChange,
          canStart,
          canUpdateProgress,
          canCancel,
          canSubmitPoolReview,
          canDecidePoolReview,
          receiverScope,
        ]
      properties:
        id:
          type: integer
          format: int64
        keyResultId:
          type: integer
          format: int64
        code:
          type: string
          description: 任务展示编号，形如 T1.1.1（AC-64；创建时分配并持久保存，删除同级任务后不重排）
        name:
          type: string
        ownerId:
          type: integer
          format: int64
          description: 任务负责人
        ownerName:
          type: string
          description: 任务负责人姓名（派生字段）
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
          description: 任务最后更新时间（任务详情页头展示，AC-50）
        status:
          $ref: "#/components/schemas/TaskStatus"
        statusLabel:
          type: string
          description: 面向用户的状态显示文案（AC-04、决策 34；派生字段）；审批等待状态为“待{当前审批人姓名}审批”，或签多人为“待{首位姓名}等N人审批”，无审批人时退化为“待审批”
        description:
          type: string
          description: 任务说明，选填
        completionCriteria:
          type: string
          description: 完成标准，选填
        currentStage:
          type: string
          description: 当前环节（词汇表「当前环节」；中文标签，派生字段）
        pendingActorId:
          type: integer
          format: int64
          description: 待行动人（词汇表「待行动人」；派生字段，无待行动人时不返回）
        pendingActorName:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 可选进度百分比（词汇表「任务进度」）；已完成任务一律 100 且不可编辑，未填写时不返回、前端只展示状态（AC-63）
        cancelReason:
          type: string
          description: 取消原因（已取消任务保留，PRD §5.1）
        poolReview:
          $ref: "#/components/schemas/PoolReview"
        canStart:
          type: boolean
          description: 当前用户能否开始执行本任务（派生字段；负责人／可编辑项目者，未开始或等待输入时）
        canUpdateProgress:
          type: boolean
          description: 当前用户能否更新本任务进度（派生字段；负责人／可编辑项目者，仅进行中；完成后锁定为 100，AC-63）
        canCancel:
          type: boolean
          description: 当前用户能否发起取消申请（派生字段；任务负责人／项目管理员，非终态且任务上没有未决审批单，AC-57）
        fieldChange:
          $ref: "#/components/schemas/FieldChange"
          description: 最近一张需要关注的变更单（待审批＝拟议值标示，或退回未处理＝退回待处理事项）；无则不返回
        deliverableNames:
          type: array
          description: 交付物项名称列表（列表「预期交付物」列展示用，派生字段）
          items:
            type: string
        canProposeFieldChange:
          type: boolean
          description: 当前用户能否编辑任务／提交关键字段修改（派生字段）
        pendingReviewCount:
          type: integer
          description: 本任务上未决审批单条数（派生字段；入池、关键字段变更／取消、完成申请合计，前端不再自行相加）
        canDiscuss:
          type: boolean
          description: 当前用户能否提交任务讨论（派生字段；全体项目内成员含访客，公开项目的隐式访客不可，见词汇表「隐式访客」）
        canManageDeliverables:
          type: boolean
          description: 当前用户能否配置任务交付物项（派生字段；负责人／创建人／可编辑项目者，非终态）
        canSubmitCompletion:
          type: boolean
          description: 当前用户能否提交完成申请（派生字段；负责人，进行中且有候选内容）
        canManageReviewers:
          type: boolean
          description: 当前用户能否调整中间审核人配置（派生字段；负责人／创建人／可编辑项目者，审核中与终态不可）
        openBlockerCount:
          type: integer
          description: 当前派生卡点数量（派生字段）
        canUploadCandidate:
          type: boolean
          description: 当前用户能否登记候选交付物内容（派生字段；负责人，执行类状态）
        canSubmitPoolReview:
          type: boolean
          description: 当前用户能否提交本任务入池（派生字段；草稿且为创建人／负责人／可编辑项目者）
        canDecidePoolReview:
          type: boolean
          description: 当前用户能否处理本任务的入池审批（派生字段；仅所属 KR 负责人）
        receiverScope:
          $ref: "#/components/schemas/ReceiverScope"
        receivers:
          type: array
          description: 指定成员为接收方时的名单（receiverScope=members；其余取值为空数组）
          items:
            $ref: "#/components/schemas/ReviewerInfo"
        canManageReceivers:
          type: boolean
          description: 当前用户能否配置接收方（派生字段；与输入／输出配置同口径：负责人／创建人／可编辑项目者，终态不可）
        canConfirmReceipt:
          type: boolean
          description: 当前用户是否有本任务的待接收项待确认（派生字段；MW-09）
        participants:
          type: array
          description: >-
            参与人名单（词汇表「参与人」；PRD §9.2 按需字段）：任务上除负责人以外的协作者，
            只作展示与检索——不产生待办、不进审批链、不影响权限、不参与我的工作归组与排序。
            未配置时为空数组
          items:
            $ref: "#/components/schemas/ReviewerInfo"
        canManageParticipants:
          type: boolean
          description: 当前用户能否配置参与人（派生字段；负责人／创建人／可编辑项目者，终态不可）
        resultUpdate:
          $ref: "#/components/schemas/ResultUpdateState"
        canStartResultUpdate:
          type: boolean
          description: >-
            当前用户能否对本任务发起成果更新（派生字段；AC-66：任务负责人／项目管理员，
            任务已完成、无在途成果更新且没有其他未决审批单）
    CreateTaskItem:
      type: object
      required: [keyResultId, name, ownerId, startDate, endDate]
      properties:
        keyResultId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 200
        ownerId:
          type: integer
          format: int64
          description: 任务负责人，必须是项目成员
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        expectedDeliverable:
          type: string
          maxLength: 100
          description: 预期交付物名称（选填，原型创建弹窗列）；随任务创建对应交付物项
    CreateTaskBatchRequest:
      type: object
      required: [items, submitForReview]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateTaskItem"
        submitForReview:
          type: boolean
          description: true 时保存后立即提交各自所属 KR 的入池审批（原型「提交入池审批」按钮）；KR 负责人本人创建的任务始终免审直接进入未开始
        taskInviteId:
          type: integer
          format: int64
          description: 通过任务创建邀请响应时携带（AC-03）；须为发给当前用户的待处理邀请，且本批至少一项任务属于邀请指定的 KR 并提交入池，成功后邀请变为已完成
    TaskDetail:
      type: object
      description: 任务详情抽屉数据（AC-31／AC-34）：任务事实、O／KR 归属与全部审核记录
      required:
        [
          task,
          objectiveTitle,
          krDescription,
          poolReviews,
          fieldChanges,
          impactedTargets,
          deliverables,
          discussions,
          completionReviews,
          reviewers,
          blockers,
          inputs,
          outputs,
          upstream,
          downstream,
          activities,
          receipts,
        ]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        objectiveTitle:
          type: string
          description: 所属 O 标题（派生字段）
        krDescription:
          type: string
          description: 所属 KR 描述（派生字段）
        poolReviews:
          type: array
          description: 入池审批记录，最新在前（词汇表「审核记录」）
          items:
            $ref: "#/components/schemas/PoolReview"
        fieldChanges:
          type: array
          description: 关键字段变更单记录，最新在前（词汇表「关键字段变更单」）
          items:
            $ref: "#/components/schemas/FieldChange"
        deliverables:
          type: array
          description: 交付物项列表（含当前内容与候选审核提示，AC-32／AC-33）
          items:
            $ref: "#/components/schemas/Deliverable"
        files:
          type: array
          description: >-
            任务下的过程文件与重要外部材料（§7.7）：不进入完成审批、不作为下游正式输入，
            可按需选进成果包；未配置时为空数组
          items:
            $ref: "#/components/schemas/TaskFile"
        discussions:
          type: array
          description: 任务讨论意见，按时间正序（AC-35／AC-36）
          items:
            $ref: "#/components/schemas/Discussion"
        completionReviews:
          type: array
          description: 完成申请记录，最新在前（AC-13／AC-15／AC-38～40）
          items:
            $ref: "#/components/schemas/CompletionReview"
        reviewers:
          type: array
          description: 任务级中间审核人配置（或签组；提交完成申请时快照进申请）
          items:
            $ref: "#/components/schemas/ReviewerInfo"
        blockers:
          type: array
          description: 本任务当前派生的结构化卡点（AC-11）
          items:
            $ref: "#/components/schemas/Blocker"
        inputs:
          type: array
          description: 指向本任务的交付物边（必要输入与参考输入，AC-07／28）
          items:
            $ref: "#/components/schemas/DeliverableEdge"
        outputs:
          type: array
          description: 从本任务出发的交付物边（直接下游）
          items:
            $ref: "#/components/schemas/DeliverableEdge"
        impactedTargets:
          type: array
          description: >-
            受影响 O／KR（系统推导；协作关系 PRD §8.1）：从本任务出发沿下游硬前置交付物边传递闭包，
            收集途经任务所属的 KR 及其 O。反馈、参考输入与普通双向协作不计入；不含本任务所属 KR
          items:
            $ref: "#/components/schemas/ImpactedTarget"
        upstream:
          type: array
          description: 协作关系摘要——直接上游分组（词汇表；派生字段，无关系时为空数组，前端按空组隐藏）
          items:
            $ref: "#/components/schemas/TaskRelation"
        downstream:
          type: array
          description: 协作关系摘要——直接下游分组（词汇表；派生字段，无关系时为空数组，前端按空组隐藏）
          items:
            $ref: "#/components/schemas/TaskRelation"
        activities:
          type: array
          description: 任务动态，最新在前（词汇表「任务动态」；ADR 0002）
          items:
            $ref: "#/components/schemas/TaskActivity"
        receipts:
          type: array
          description: 待接收项与接收记录（词汇表「接收记录」；终审通过后按当时接收方名单逐人生成，MW-09）
          items:
            $ref: "#/components/schemas/TaskReceipt"
    TaskActivityKind:
      type: string
      description: 任务动态类型（ADR 0002）；blocker_* 为系统派生，无行动人
      enum:
        [
          pool_submitted,
          pool_approved,
          pool_rejected,
          field_change_submitted,
          field_change_approved,
          field_change_rejected,
          field_change_abandoned,
          completion_submitted,
          completion_approved,
          completion_rejected,
          receipt_confirmed,
          blocker_opened,
          blocker_resolved,
        ]
    TaskActivity:
      type: object
      description: 任务动态的一条事实（词汇表「任务动态」）：已经发生、不可撤销，只记录不派生，不可编辑或删除
      required: [id, kind, kindLabel, summary, occurredAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/TaskActivityKind"
        kindLabel:
          type: string
          description: 动态类型的中文名（派生字段）；行级显示消费本字段，前端不按枚举拼文案
        actorName:
          type: string
          description: 行动人姓名（派生字段）；系统派生事件不返回
        summary:
          type: string
          description: 面向用户的一句话，写入时定型；退回类动态带上一句话理由
        occurredAt:
          type: string
          format: date-time
    TaskRelation:
      type: object
      description: 协作关系摘要中的一条直接协作关系（词汇表「协作关系摘要」；PRD §7.5）；不插入交付物中间节点，同一对方任务同一关系类型合并为一条
      required: [taskId, taskName, krDescription, edgeType, ownerName, taskStatusLabel, ready]
      properties:
        taskId:
          type: integer
          format: int64
          description: 对方任务
        taskName:
          type: string
        krDescription:
          type: string
          description: 对方任务所属 KR 描述（派生字段）
        edgeType:
          $ref: "#/components/schemas/EdgeType"
        edgeTypeLabel:
          type: string
          description: 关系类型显示文案（派生字段；前端不按枚举拼文案）
        ownerName:
          type: string
          description: 对方任务负责人姓名（派生字段）
        taskStatusLabel:
          type: string
          description: 对方任务状态显示文案（AC-04；派生字段）
        ready:
          type: boolean
          description: 该关系是否就绪（AC-48；合并后全部边就绪才为真）
    FieldChangeState:
      type: string
      enum: [pending, approved, rejected]
    FieldChangeDiff:
      type: object
      description: 单个关键字段的修改前后差异（展示用字符串）
      required: [field, label, oldValue, newValue]
      properties:
        field:
          type: string
          description: 字段名（name／description／completionCriteria／ownerId／endDate）
        label:
          type: string
          description: 中文字段名（派生字段）
        oldValue:
          type: string
        newValue:
          type: string
    FieldChangeType:
      type: string
      description: >-
        变更类型（PRD §5.2.B）：关键字段修改（标题／说明／量化标准／负责人／截止时间）、
        结构变更（输入、输入源、输出、接收方）或任务取消申请，三者复用同一张变更单
      enum: [key_fields, structure, cancel]
    FieldChange:
      type: object
      description: 关键字段变更单（词汇表）；rejected 且 resolved=false 即「退回待处理事项」
      required: [id, changeType, state, stateLabel, reason, resolved, exempt, changes]
      properties:
        id:
          type: integer
          format: int64
        changeType:
          $ref: "#/components/schemas/FieldChangeType"
        state:
          $ref: "#/components/schemas/FieldChangeState"
        stateLabel:
          type: string
          description: 面向用户的显示文案（AC-04；派生字段）：待审批为“待{所属 KR 负责人姓名}审批”，免审为“免审生效”，其余为“已通过／已退回”
        reason:
          type: string
          description: 修改原因
        opinion:
          type: string
          description: 审批意见
        resolved:
          type: boolean
          description: 退回后是否已处理（重新提交或放弃）
        exempt:
          type: boolean
          description: KR 负责人本人修改免审即时生效时由系统标记
        changes:
          type: array
          items:
            $ref: "#/components/schemas/FieldChangeDiff"
        submittedById:
          type: integer
          format: int64
        submittedByName:
          type: string
        decidedByName:
          type: string
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        canDecide:
          type: boolean
          description: 当前用户能否处理本变更单（派生字段；仅所属 KR 负责人且待审批）
        canAbandon:
          type: boolean
          description: 当前用户能否放弃本次变更（派生字段；退回未处理且为提交人／可编辑项目者）
    SubmitFieldChangeRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: object
          description: 拟议值；至少一项。草稿任务直接生效；KR 负责人改本人 KR 下任务免审即时生效
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type: string
              maxLength: 2000
            completionCriteria:
              type: string
              maxLength: 2000
            ownerId:
              type: integer
              format: int64
            endDate:
              type: string
              format: date
        reason:
          type: string
          maxLength: 500
          description: 修改原因；进入审批（含免审留痕）时必填，草稿直接完善可不填
    FieldChangeDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        opinion:
          type: string
          maxLength: 500
    CommitUploadRequest:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: integer
          format: int64
          description: 第一步返回的内容记录 id
    DeliverableEdgeRef:
      type: object
      description: 交付物承接的关系边引用（词汇表「交付物边」）：本交付物是这条边的来源内容
      required: [edgeId, edgeType, edgeTypeLabel, targetTaskId, targetTaskName]
      properties:
        edgeId:
          type: integer
          format: int64
        edgeType:
          $ref: "#/components/schemas/EdgeType"
        edgeTypeLabel:
          type: string
          description: 交付物边类型显示文案（派生字段）
        targetTaskId:
          type: integer
          format: int64
          description: 下游（接收）任务
        targetTaskName:
          type: string

    DeliverableFile:
      type: object
      description: 交付物内容（词汇表「交付物」；当前已生效或候选审核中）
      required: [id, state, fileName]
      properties:
        id:
          type: integer
          format: int64
        state:
          type: string
          enum: [current, candidate, uploading]
          description: uploading 表示已建记录但文件尚未确认写入对象存储，未确认前不参与就绪判定
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
          format: int64
          description: 字节数
        uploadedByName:
          type: string
          description: 提交人姓名（派生字段）
        uploadedAt:
          type: string
          format: date-time
        effectiveAt:
          type: string
          format: date-time
          description: 当前内容的生效时间（终审通过时刻）
    Deliverable:
      type: object
      description: 交付物项：至多一份当前内容与一份候选内容，无版本号与历史（PRD §5.3）
      required: [id, taskId, name, contentState, contentStateLabel, edges]
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        name:
          type: string
        current:
          $ref: "#/components/schemas/DeliverableFile"
        candidate:
          $ref: "#/components/schemas/DeliverableFile"
          description: >-
            候选内容；是否在审看 contentState——已上传未提交时是「待提交审核」。
            任务概况只提示不展示内容（AC-33）
        contentState:
          type: string
          enum: [empty, pending_submit, reviewing, effective, updating]
          description: >-
            内容状态（读时派生，不落库；AC-17、AC-67）：empty＝未提交；pending_submit＝候选内容已上传但
            尚未随完成申请提交（「待提交审核」，不进入任何审批）；reviewing＝候选已随完成申请提交在审；
            effective＝当前内容已生效；updating＝已生效之上还有在审的候选。
            「在审」以存在未决完成申请为准，不以候选文件在不在为准
        contentStateLabel:
          type: string
          description: 内容状态显示文案（派生字段）
        contentStateAt:
          type: string
          format: date-time
          description: 提交／生效时间：有当前内容取生效时刻，否则取候选提交时刻（派生字段）
        edges:
          type: array
          description: 本交付物承接的来源关系边（AC-17 归档视角需在列表层可见可点）
          items:
            $ref: "#/components/schemas/DeliverableEdgeRef"
    CreateDeliverableRequest:
      type: object
      description: |
        新增交付物项（裁决 G1）：不收项名，入口就是选文件。
        项名由服务端按文件名派生（去掉最后一段扩展名，见 domain.DeliverableName）；
        同一任务下重名会被拒绝（invalid_deliverable），同一件成果的新版本走已有项的重传候选内容。
        本请求只建项，不登记内容：客户端在项建立后再走 candidate 两阶段上传。
      required: [fileName]
      properties:
        fileName:
          type: string
          description: 用户选中的文件名，项名由它派生
          minLength: 1
          maxLength: 200
    UploadCandidateRequest:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        fileType:
          type: string
          maxLength: 100
        fileSize:
          type: integer
          format: int64
    UploadCandidateResponse:
      type: object
      required: [file, uploadUrl]
      properties:
        file:
          $ref: "#/components/schemas/DeliverableFile"
        uploadUrl:
          type: string
          description: MinIO 预签名 PUT 地址，客户端直接上传文件内容
    TaskFileKind:
      type: string
      description: >-
        任务文件类型（词汇表「过程文件」「重要外部材料」；§7.7 文件对象边界表）：
        process＝过程文件，任务执行过程中产生、不作为正式成果提交审核；
        external＝重要外部材料，项目外部提供、经内部协调人代为录入。
        两者都不进入完成审批、不作为下游任务的正式输入（外部材料可作输入证据，
        但不把输入置为就绪），可以按需选进成果包
      enum: [process, external]
    TaskFile:
      type: object
      description: 任务下的过程文件或重要外部材料（§7.7；与交付物同走两阶段提交，未确认写入的记录不返回）
      required: [id, taskId, kind, kindLabel, fileName, uploadedAt]
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/TaskFileKind"
        kindLabel:
          type: string
          description: 类型显示文案（派生字段）
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
          format: int64
        note:
          type: string
          description: 背景说明，选填
        uploadedByName:
          type: string
          description: 上传人姓名（派生字段）
        uploadedAt:
          type: string
          format: date-time
    UploadTaskFileRequest:
      type: object
      required: [kind, fileName]
      properties:
        kind:
          $ref: "#/components/schemas/TaskFileKind"
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        fileType:
          type: string
        fileSize:
          type: integer
          format: int64
          description: 客户端自报大小，仅作提示；确认时以对象存储的真实大小为准
        note:
          type: string
          maxLength: 500
          description: 背景说明，选填
    UploadTaskFileResponse:
      type: object
      required: [file, uploadUrl]
      properties:
        file:
          $ref: "#/components/schemas/TaskFile"
        uploadUrl:
          type: string
          description: MinIO 预签名 PUT 地址，客户端直接上传文件内容
    DownloadUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: MinIO 预签名 GET 地址（预览/下载）
    Discussion:
      type: object
      description: 任务讨论意见（词汇表「任务讨论」）；提交后不可编辑或删除
      required: [id, taskId, authorId, authorName, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        authorName:
          type: string
        content:
          type: string
        mentionNames:
          type: array
          description: 被 @ 成员姓名（派生字段）
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    CreateDiscussionRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        mentionUserIds:
          type: array
          description: 被 @ 的项目成员
          items:
            type: integer
            format: int64
    Notification:
      type: object
      description: 站内通知（词汇表「站内通知」）
      required: [id, kind, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: 通知类型（discussion_mention／discussion_owner 等）
        content:
          type: string
        projectId:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
    EdgeType:
      type: string
      description: 交付物边类型（PRD §4.3；词汇表「交付物边」）
      enum: [hard_prerequisite, information, handover, feedback]
    Necessity:
      type: string
      description: 输入必要性（必要／参考）
      enum: [required, reference]
    DeliverableEdge:
      type: object
      description: 交付物边（词汇表）；边上关联当前与候选交付物，就绪状态派生（AC-48）
      required: [id, name, edgeType, necessity, targetTaskId, ready, hasCandidate]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: |
            输入源的可读标识（派生字段，裁决 F1）：来源是已有任务时为「编号 · 任务名」，
            来源是指定项目成员时为「所需内容」摘要。读时现算，不由客户端提供。
        edgeType:
          $ref: "#/components/schemas/EdgeType"
        edgeTypeLabel:
          type: string
          description: 交付物边类型显示文案（派生字段；前端不按枚举拼文案）
        necessity:
          $ref: "#/components/schemas/Necessity"
        sourceTaskId:
          type: integer
          format: int64
          description: 来源任务（来源为指定项目成员时缺省，见 #14）
        sourceTaskName:
          type: string
        sourceTaskCode:
          type: string
          description: 来源任务编号（派生字段，形如 T1.1.1）；来源为指定项目成员时缺省，与 sourceTaskId 同缺省
        sourceTaskStatus:
          $ref: "#/components/schemas/TaskStatus"
        sourceTaskStatusLabel:
          type: string
          description: 来源任务状态显示文案（AC-04；派生字段，与 sourceTaskStatus 同缺省）
        sourceOwnerName:
          type: string
          description: 提供方姓名（派生字段）
        targetTaskId:
          type: integer
          format: int64
        targetTaskName:
          type: string
        deliverableId:
          type: integer
          format: int64
          description: 对应来源任务的交付物项
        deliverableName:
          type: string
        currentFileId:
          type: integer
          format: int64
          description: 已生效当前内容（可下载；派生字段）
        currentFileName:
          type: string
        ready:
          type: boolean
          description: 关系就绪状态（AC-48）：仅当前内容生效时就绪；候选不提前满足输入
        hasCandidate:
          type: boolean
          description: 审核期间存在候选更新（不改变原有就绪状态）
        expectedDate:
          type: string
          format: date
          description: 期望时间
        canRemove:
          type: boolean
          description: 当前用户能否解除该边（派生字段；目标任务负责人／可编辑项目者）
        inputRequest:
          $ref: "#/components/schemas/InputRequest"
          description: 来源为指定项目成员时的输入请求（AC-29／30）
        interlockRisk:
          type: boolean
          description: 硬前置循环互锁风险（派生字段，AC-10）；循环部分暂停关键路径计算
        onCriticalPath:
          type: boolean
          description: 位于硬前置关键路径上（派生字段，AC-10）；日期不足时不派生（此时仅硬依赖链）
    CreateTaskInputRequest:
      type: object
      description: |
        新增输入要求（来源＝系统内已有任务，AC-28；可一次多选来源任务，AC-53）。
        不收输入名称：输入源的可读标识由来源任务派生（裁决 F1），见 DeliverableEdge.name。
      required: [necessity, edgeType, sourceTaskIds]
      properties:
        necessity:
          $ref: "#/components/schemas/Necessity"
        edgeType:
          $ref: "#/components/schemas/EdgeType"
        sourceTaskIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          description: 来源任务（AC-53 多选）；确认后按选择顺序分别建立「来源任务 → 目标任务」交付物边，不可重复
        deliverableId:
          type: integer
          format: int64
          description: 来源任务的交付物项（选填；未选时以边本身表达结构化条件；仅在只选一个来源任务时可指定）
        expectedDate:
          type: string
          format: date
    ImportTaskItem:
      type: object
      required: [name, ownerId, startDate, endDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        ownerId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        expectedDeliverable:
          type: string
          maxLength: 100
    ImportKrItem:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          type: string
          maxLength: 100
        ownerId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ImportTaskItem"
    ImportItem:
      type: object
      description: 二选一：title 新建 O，或 objectiveId 挂到已有 O
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        objectiveId:
          type: integer
          format: int64
        keyResults:
          type: array
          items:
            $ref: "#/components/schemas/ImportKrItem"
    ImportRequest:
      type: object
      description: 表格导入（AC-02）：字段映射与人员匹配在前端完成，此处提交结构化结果；整批一个事务
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ImportItem"
        sourceFileName:
          type: string
          maxLength: 200
          description: 源文件名（§7.9 导入记录留存用；AC-68）
    ImportRecord:
      type: object
      description: >-
        一次表格导入的业务事实（词汇表「导入记录」；§7.9、AC-68）。与通用操作审计并列而非重复：
        审计不含文件名与影响计数，也不记失败的那一次
      required: [id, operatorName, importedAt, objectiveCount, keyResultCount, taskCount, result, resultLabel]
      properties:
        id:
          type: integer
          format: int64
        operatorName:
          type: string
          description: 操作人姓名（派生字段）
        importedAt:
          type: string
          format: date-time
        sourceFileName:
          type: string
        objectiveCount:
          type: integer
          description: 本次真实新建的 O 数
        keyResultCount:
          type: integer
          description: 本次真实新建的 KR 数
        taskCount:
          type: integer
          description: 本次真实新建的任务数
        result:
          type: string
          enum: [success, partial, failed]
          description: 导入结果；失败绝不写成功
        resultLabel:
          type: string
          description: 结果显示文案（派生字段）
        failureSummary:
          type: string
          description: 失败摘要；成功时为空
    ImportTasksRequest:
      type: object
      description: 任务批量导入（AC-02b）：按所属 KR 分组提交，整批一个事务
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ImportTaskGroup"
        sourceFileName:
          type: string
          maxLength: 200
          description: 源文件名，随导入记录留存（AC-68）
    ImportTaskGroup:
      type: object
      required: [keyResultId, tasks]
      properties:
        keyResultId:
          type: integer
          format: int64
          description: 所属 KR；前端按 KR 编号定位后传 id，编号不存在的行不会到这里
        tasks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ImportTaskItem"
    ImportTasksResult:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          description: 本次生成的任务草稿（按 KR 批量提交入池，AC-25）
          items:
            $ref: "#/components/schemas/Task"
    ImportResult:
      type: object
      required: [objectives, tasks]
      properties:
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/Objective"
        tasks:
          type: array
          description: 导入生成的任务草稿（待按 KR 批量提交入池，AC-25）
          items:
            $ref: "#/components/schemas/Task"
    BatchPoolSubmitRequest:
      type: object
      required: [taskIds]
      properties:
        taskIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
    BatchPoolDecisionRequest:
      type: object
      required: [taskIds, decision]
      properties:
        taskIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        decision:
          type: string
          enum: [approved, rejected]
        opinion:
          type: string
          maxLength: 500
    ReportRange:
      type: string
      description: 报告时间范围（PRD §7.8）
      enum: [today, week, month, all]
    ReportKrProgress:
      type: object
      required: [keyResultId, description, riskLevel, totalTasks, filledTasks, completedInRange]
      properties:
        keyResultId:
          type: integer
          format: int64
        description:
          type: string
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        totalTasks:
          type: integer
        filledTasks:
          type: integer
        averageProgress:
          type: integer
        completedInRange:
          type: integer
          description: 范围内终审通过的任务数
    ReportDeliverable:
      type: object
      required: [taskName, deliverableName, fileName]
      properties:
        taskName:
          type: string
        deliverableName:
          type: string
        fileName:
          type: string
        effectiveAt:
          type: string
          format: date-time
    ReportBlocker:
      type: object
      required: [taskName, kind, kindLabel, missing, reason, level]
      properties:
        taskName:
          type: string
        kind:
          $ref: "#/components/schemas/BlockerKind"
        kindLabel:
          type: string
          description: 四类卡点的中文类型名（派生字段）
        missing:
          type: string
        reason:
          type: string
        level:
          $ref: "#/components/schemas/RiskLevel"
        actionOwnerName:
          type: string
        since:
          type: string
          format: date-time
    ReportNextStep:
      type: object
      required: [taskName, ownerName, status, statusLabel]
      properties:
        taskName:
          type: string
        ownerName:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        statusLabel:
          type: string
          description: 状态显示文案（AC-04；派生字段）
        endDate:
          type: string
          format: date
        overdue:
          type: boolean
        unreadyNote:
          type: string
          description: 「上游未就绪：缺 XX」注记（派生字段，与我的工作同一口径）；状态为「等待输入」时说清缺哪一项，输入齐备时不返回
    Report:
      type: object
      description: 项目报告（AC-19）：从同一份项目事实生成，不要求成员重复填报
      required:
        [range, generatedAt, krProgress, completedDeliverables, blockers, pendingApprovals, nextSteps]
      properties:
        range:
          $ref: "#/components/schemas/ReportRange"
        generatedAt:
          type: string
          format: date-time
        krProgress:
          type: array
          items:
            $ref: "#/components/schemas/ReportKrProgress"
        completedDeliverables:
          type: array
          description: 范围内生效的当前成果
          items:
            $ref: "#/components/schemas/ReportDeliverable"
        blockers:
          type: array
          description: 开放中的卡点 + 范围内解除的卡点
          items:
            $ref: "#/components/schemas/ReportBlocker"
        pendingApprovals:
          type: object
          description: 待决策：停留在审批队列中的事项数
          required: [poolReviews, fieldChanges, completions]
          properties:
            poolReviews:
              type: integer
            fieldChanges:
              type: integer
            completions:
              type: integer
        nextSteps:
          type: array
          description: 下一步：临近截止或已超期的未完成任务（按截止时间升序）
          items:
            $ref: "#/components/schemas/ReportNextStep"
    ArtifactTask:
      type: object
      description: 归档视角的任务节点（AC-17）：当前成果、候选状态与审批记录数，无历史版本入口
      required:
        [
          taskId,
          code,
          name,
          ownerName,
          receiverLabel,
          status,
          statusLabel,
          reviewCount,
          deliverables,
        ]
      properties:
        taskId:
          type: integer
          format: int64
        code:
          type: string
          description: 任务展示编号，形如 T1.1.1（AC-64；派生字段）
        name:
          type: string
        ownerName:
          type: string
          description: 任务负责人姓名（派生字段）
        receiverLabel:
          type: string
          description: 接收方展示文案（词汇表「接收方」；未配置为「不配置」；派生字段）
        status:
          $ref: "#/components/schemas/TaskStatus"
        statusLabel:
          type: string
          description: 状态显示文案（AC-04；派生字段）
        reviewCount:
          type: integer
          description: 完成审核记录条数（详情在任务抽屉审核 Tab）
        deliverables:
          type: array
          items:
            $ref: "#/components/schemas/Deliverable"
        files:
          type: array
          description: 本任务下的过程文件与重要外部材料（§7.7；归档按「文件类型」维筛选用）
          items:
            $ref: "#/components/schemas/TaskFile"
    ArtifactKr:
      type: object
      description: 归档视角的 KR 分组（AC-17）：成果按 KR 归集，组头给出 KR 负责人与交付物数量
      required:
        [keyResultId, code, description, ownerName, deliverableCount, tasks]
      properties:
        keyResultId:
          type: integer
          format: int64
        code:
          type: string
          description: KR 展示编号，形如 KR1.1（AC-64；派生字段）
        description:
          type: string
        ownerName:
          type: string
          description: KR 负责人姓名（派生字段）
        deliverableCount:
          type: integer
          description: 本 KR 下交付物项总数（派生字段）
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactTask"
    ArtifactObjective:
      type: object
      required: [objectiveId, code, title, krs]
      properties:
        objectiveId:
          type: integer
          format: int64
        code:
          type: string
          description: O 展示编号，形如 O1（AC-64；派生字段）
        title:
          type: string
        krs:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactKr"
    PackageItem:
      type: object
      description: >-
        成果包目录项（AC-18）：二选一引用——交付物项（下载时解析为当前内容，不复制旧文件），
        或任务文件（过程文件／重要外部材料，§7.7「可以按需选择」）。
        任务文件被删除后条目不消失：按快照保留名称与所属任务，sourceDeleted 为真、包内不放该文件
      required: [deliverableName, taskName, sourceDeleted]
      properties:
        deliverableId:
          type: integer
          format: int64
          description: 引用交付物项时给出
        taskFileId:
          type: integer
          format: int64
          description: 引用过程文件或重要外部材料时给出
        fileKind:
          $ref: "#/components/schemas/TaskFileKind"
          description: 任务文件目录项的类型；交付物目录项不返回
        deliverableName:
          type: string
          description: 交付物项名称；任务文件目录项取文件名
        taskName:
          type: string
        fileId:
          type: integer
          format: int64
          description: 当前内容（被覆盖后自动解析为新内容；无当前内容时缺省）
        fileName:
          type: string
        effectiveAt:
          type: string
          format: date-time
        sourceDeleted:
          type: boolean
          description: >-
            来源文件已删除（§7.7、AC-18；派生字段）。仅任务文件目录项可能为真——
            条目按快照保留在目录与来源清单里，但下载的包内不含该文件。交付物目录项恒为假
    ArtifactPackage:
      type: object
      description: 轻量成果包（词汇表「成果包」）
      required: [id, name, createdAt, items]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdByName:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/PackageItem"
    CreatePackageRequest:
      type: object
      required: [name, deliverableIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        deliverableIds:
          type: array
          items:
            type: integer
            format: int64
          description: 勾选的当前成果（须有已生效当前内容的交付物项）
        taskFileIds:
          type: array
          items:
            type: integer
            format: int64
          description: 勾选的过程文件或重要外部材料（§7.7「可以按需选择」；选填）
      description: 两个勾选数组至少合计一项（AC-18：成果包可含当前成果与必要过程文件）
    WorkItem:
      type: object
      description: 我的工作事项（词汇表「我的工作事项」）；卡片派生事实，动作在任务详情抽屉完成
      required: [kind, title, actionLabel, canRemind]
      properties:
        kind:
          type: string
          description: 事项类型（task/pool_review/field_change/intermediate_review/final_review/input_request/invite/upstream/blocker 等）
        title:
          type: string
        taskId:
          type: integer
          format: int64
        taskName:
          type: string
        refId:
          type: integer
          format: int64
          description: 事项自身 ID（审批单／输入请求／邀请）
        refKey:
          type: string
          description: 提醒目标的合成键；一键提醒按此寻址（卡点组为本条卡点的键，等待他人组为该等待事项自身的 wait:<事项类型>:<事项 ID>）
        dueDate:
          type: string
          format: date
          description: 任务截止或输入期望时间
        waitingDays:
          type: integer
          description: 审批件与输入请求的已等待天数（排序事实；模块 PRD §5.2 规定卡片不显示，仅供排序与详情使用）
        overdue:
          type: boolean
          description: 超期标红（模块 PRD §5.4）
        rejectedReason:
          type: string
          description: 被退回事项的「已退回：理由」
        unreadyNote:
          type: string
          description: 「上游未就绪：缺 XX」标记
        stage:
          type: string
          description: 当前环节（等待他人卡片显示停在谁手里）
        drawerTab:
          type: string
          description: 建议打开的任务详情 Tab（overview/audit/discussion）
        actionLabel:
          type: string
          description: 卡片文字按钮文案（我的工作 PRD §5.3、AC-55；派生字段）：本人要办的三组为「去处理」，等待他人与卡点为「查看详情」
        canRemind:
          type: boolean
          description: 卡片能否直接一键提醒当前待行动人（MW-13；派生字段）；按 refKey 指向的提醒目标寻址，不提醒本人、访客不可，提醒频次上限为同一人对同一任务每天 1 次
    WorkIdentity:
      type: object
      description: 我的工作身份卡（模块 PRD §3.1）：当前用户在本项目的身份与仍承担的职责
      required: [userId, username, displayName, roleLabel, responsibilities, responsibilitiesLabel]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
          description: 成员角色；项目负责人可以不在成员表里，此时缺省
        roleLabel:
          type: string
          description: 身份显示文案（派生字段；非成员的项目负责人显示为「项目负责人」）
        responsibilities:
          type: array
          description: 当前承担的职责标签，顺序固定（派生字段；口径与移出成员的职责占位同源）
          items:
            type: string
        responsibilitiesLabel:
          type: string
          description: 职责一行文案；一项不担时为「当前未承担行动职责」（派生字段）

    MyWork:
      type: object
      description: 我的工作五分组（AC-16；KR 终审归入待我审批）与身份卡
      required: [identity, pending, approvals, receipts, waiting, blockers]
      properties:
        identity:
          $ref: "#/components/schemas/WorkIdentity"
        pending:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"
        waiting:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/WorkItem"
    BlockerKind:
      type: string
      description: 四类派生卡点（词汇表「结构化卡点」；我的工作 PRD §8.7）
      enum: [upstream_unready, task_overdue, approval_timeout, interlock]
    AuditLog:
      type: object
      description: 一条项目操作审计（§10.4、R8）：谁在什么时候对哪个对象做了什么写操作
      required: [id, action, method, route, occurredAt]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
          description: 动作名（派生字段；未登记路由退化为通用词，但留痕本身不缺）
        method:
          type: string
        route:
          type: string
          description: 契约路由模板
        objectType:
          type: string
          description: 直接对象类型（tasks／members／edges…）
        objectId:
          type: integer
          format: int64
        actorName:
          type: string
        occurredAt:
          type: string
          format: date-time
    Blocker:
      type: object
      description: 结构化卡点（词汇表）；由四类结构化事实读时派生，不落库、无人工上报与手动解除，触发条件消失即消失
      required: [key, kind, kindLabel, taskId, taskName, missing, reason, level, actionOwnerIds, actionOwnerNames, since]
      properties:
        key:
          type: string
          description: 派生卡点的合成键（形如 task_overdue:42、upstream_unready:edge:17）；一键提醒按此寻址
        kind:
          $ref: "#/components/schemas/BlockerKind"
        kindLabel:
          type: string
          description: 四类卡点的中文类型名（派生字段）；行级显示消费本字段，前端不按枚举拼文案
        taskId:
          type: integer
          format: int64
        taskName:
          type: string
        missing:
          type: string
          description: 缺失的输入或条件
        reason:
          type: string
          description: 阻塞原因
        actionOwnerIds:
          type: array
          description: 当前待行动人（或签中间审核、互锁环内 KR 负责人可为多人）
          items:
            type: integer
            format: int64
        actionOwnerNames:
          type: array
          items:
            type: string
        level:
          $ref: "#/components/schemas/RiskLevel"
          description: 按事实严重度派生的预警或高风险（结构化卡点不使用 normal）
        levelLabel:
          type: string
          description: 风险等级显示文案（派生字段；前端不按枚举拼文案）
        since:
          type: string
          format: date-time
          description: 卡点产生时间（触发事实成立的时点）
        impactNote:
          type: string
          description: 影响范围一行说明（派生字段；沿硬前置下游任务汇总）
        canRemind:
          type: boolean
          description: 当前用户能否一键提醒（派生字段；待行动人本人不可提醒自己，访客不可）
    RemindRequest:
      type: object
      required: [targetKey]
      properties:
        targetKey:
          type: string
          maxLength: 200
          description: 提醒目标的合成键；卡点取自卡点列表或任务详情的 key，等待他人事项取自我的工作卡片的 refKey（形如 wait:<事项类型>:<事项 ID>）
    InputRequestState:
      type: string
      description: 输入请求状态（词汇表「输入请求」；PRD §5.5）。uploading：已登记待上传，文件确认写入后才转 provided
      enum: [pending, accepted, provided, uploading]
    InputRequest:
      type: object
      description: 指定项目成员的输入请求（附着在成员 → 目标任务的交付物边上）
      required: [id, edgeId, providerId, providerName, state]
      properties:
        id:
          type: integer
          format: int64
        edgeId:
          type: integer
          format: int64
        providerId:
          type: integer
          format: int64
        providerName:
          type: string
        contentNote:
          type: string
          description: 所需内容说明
        state:
          $ref: "#/components/schemas/InputRequestState"
        notifiedAt:
          type: string
          format: date-time
          description: 站内通知发送时间（入池审批通过后才发送）
        acceptedAt:
          type: string
          format: date-time
        providedAt:
          type: string
          format: date-time
        providedText:
          type: string
          description: 对接人提交的文字内容
        providedFileName:
          type: string
        canAccept:
          type: boolean
          description: 当前用户能否同意接收（派生字段；对接人本人且待接收）
        canProvide:
          type: boolean
          description: 当前用户能否提交内容（派生字段；对接人本人且已接收）
    CreateMemberInputRequest:
      type: object
      description: |
        新增输入要求（来源＝指定项目成员，AC-29；可一次多选对接人，AC-53）。
        不收输入名称：输入源的可读标识取「所需内容」摘要（裁决 F1），见 DeliverableEdge.name。
      required: [necessity, providerIds, contentNote, expectedDate]
      properties:
        necessity:
          $ref: "#/components/schemas/Necessity"
        providerIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          description: 对接人（非只读项目成员，AC-53 多选）；每人分别建边并生成输入请求与通知，不可重复
        contentNote:
          type: string
          minLength: 1
          maxLength: 500
          description: 所需内容（§9.1 必填）
        expectedDate:
          type: string
          format: date
          description: 期望时间（§9.1 必填）
    ProvideInputRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 2000
          description: 文字内容；与文件至少提交其一
        fileName:
          type: string
          maxLength: 200
          description: 上传文件名；返回预签名上传地址
    ProvideInputResponse:
      type: object
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/InputRequest"
        uploadUrl:
          type: string
          description: 提交了 fileName 时返回的预签名上传地址
    CompletionReviewState:
      type: string
      description: 完成申请状态（词汇表「完成申请」；PRD §5.2.C）
      enum: [intermediate_review, pending_final, approved, rejected]
    CompletionReviewItem:
      type: object
      description: 申请内的候选交付物快照；文件按覆盖／退回规则删除后 fileId 不再返回
      required: [deliverableId, deliverableName, fileName]
      properties:
        deliverableId:
          type: integer
          format: int64
        deliverableName:
          type: string
        fileName:
          type: string
        fileId:
          type: integer
          format: int64
          description: 仍可预览／下载的在库文件；已删除时缺省
    ReviewerInfo:
      type: object
      required: [userId, displayName]
      properties:
        userId:
          type: integer
          format: int64
        displayName:
          type: string
    ReceiverScope:
      type: string
      description: 接收方范围（词汇表「接收方」；模块 PRD §8.6）：不配置、指定成员或所有项目成员
      enum: [none, members, all]
    TaskReceipt:
      type: object
      description: 一条待接收项／接收记录：未确认为待接收项，已确认为接收记录（接收方、任务、生成时间、确认时间）
      required: [id, userId, displayName, generatedAt]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        displayName:
          type: string
        generatedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          description: 确认接收时间；未确认时不返回
    SetReceiversRequest:
      type: object
      required: [scope]
      properties:
        scope:
          $ref: "#/components/schemas/ReceiverScope"
        userIds:
          type: array
          description: scope=members 时的接收方名单（至少一人，须为项目成员）；其余取值忽略
          items:
            type: integer
            format: int64
    SetParticipantsRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          description: 参与人名单（可为空表示清空）；须为项目成员，且不含任务负责人本人
          items:
            type: integer
            format: int64
    SetReviewersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          description: 中间审核人（或签组；可为空表示不配置）；须为非只读项目成员
          items:
            type: integer
            format: int64
    CompletionReview:
      type: object
      description: 完成申请（词汇表）；整体通过或整体退回
      required: [id, state, stateLabel, note, items]
      properties:
        id:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/CompletionReviewState"
        stateLabel:
          type: string
          description: 面向用户的显示文案（AC-04；派生字段）：中间或签为“待{审核人姓名}审批”（多人为“待{首位姓名}等N人审批”），待终审为“待{所属 KR 负责人姓名}审批”，其余为“已通过／已退回”
        note:
          type: string
          description: 提交说明
        opinion:
          type: string
          description: 审核意见；退回意见必填（AC-38）
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompletionReviewItem"
        submittedByName:
          type: string
        decidedByName:
          type: string
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        reviewers:
          type: array
          description: 中间审核组快照（或签；AC-14）
          items:
            $ref: "#/components/schemas/ReviewerInfo"
        intermediateByName:
          type: string
          description: 或签通过的处理人姓名（派生字段）
        intermediateAt:
          type: string
          format: date-time
        intermediateOpinion:
          type: string
        canDecide:
          type: boolean
          description: 当前用户能否处理本申请（派生字段；中间审核中为或签组成员，待 KR 终审时仅所属 KR 负责人，AC-37）
    SubmitCompletionRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: 提交说明（§9.1 必填）
    CompletionDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        opinion:
          type: string
          maxLength: 500
          description: 通过意见选填，退回意见必填（AC-38）
    TaskInviteState:
      type: string
      description: 任务创建邀请状态（词汇表「任务创建邀请」）
      enum: [pending, completed, revoked]
    TaskInvite:
      type: object
      required: [id, keyResultId, inviterId, inviterName, inviteeId, inviteeName, state, createdAt, canHandle, canRevoke]
      properties:
        id:
          type: integer
          format: int64
        keyResultId:
          type: integer
          format: int64
        inviterId:
          type: integer
          format: int64
        inviterName:
          type: string
          description: 邀请人姓名（派生字段）
        inviteeId:
          type: integer
          format: int64
        inviteeName:
          type: string
          description: 受邀成员姓名（派生字段）
        note:
          type: string
          description: 邀请说明
        state:
          $ref: "#/components/schemas/TaskInviteState"
        createdAt:
          type: string
          format: date-time
        canHandle:
          type: boolean
          description: 当前用户能否响应本邀请（派生字段；受邀人且待处理）
        canRevoke:
          type: boolean
          description: 当前用户能否撤回本邀请（派生字段；邀请人／项目管理员／项目负责人且待处理）
    CreateTaskInvitesRequest:
      type: object
      required: [keyResultId, inviteeIds]
      properties:
        keyResultId:
          type: integer
          format: int64
        inviteeIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          description: 受邀成员（可多选；须为非只读项目成员，不能邀请自己）
        note:
          type: string
          maxLength: 500
          description: 邀请说明，随站内通知一同展示
    PoolReviewDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        opinion:
          type: string
          maxLength: 500
    Project:
      type: object
      required: [id, name, ownerId, ownerName, status, createdAt, canEdit, canManageMembers, visibility, visibilityLabel, implicitViewer]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        ownerId:
          type: integer
          format: int64
          description: 项目负责人（单人；与项目管理员为独立角色）
        ownerName:
          type: string
          description: 项目负责人姓名（派生字段，前端直接展示）
        status:
          $ref: "#/components/schemas/ProjectStatus"
        statusLabel:
          type: string
          description: 项目状态显示文案（派生字段；前端不按枚举拼文案）
        stage:
          type: string
          description: 业务里程碑标签，自由文本，选填
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        canEdit:
          type: boolean
          description: 当前用户能否编辑本项目（派生字段，按成员角色与项目负责人身份在 domain 层判定）
        canManageMembers:
          type: boolean
          description: 当前用户能否管理本项目成员和权限（派生字段，同上）
        visibility:
          $ref: "#/components/schemas/ProjectVisibility"
        visibilityLabel:
          type: string
          description: 项目可见性显示文案（派生字段；前端不按枚举拼文案）
        implicitViewer:
          type: boolean
          description: |
            当前用户是靠项目公开才看得见本项目的隐式访客（派生字段，词汇表「隐式访客」）。
            true 时此人不是项目成员：只读全部、写动作一律 403、不发讨论、不进人员选择器。
            项目列表按它区分「我参与的」与「公开可见的」，前端不自己算。
    ProjectVisibility:
      type: string
      description: |
        项目可见性（词汇表「项目可见性」；裁决 D1）：
        private ＝ 只有项目成员与项目负责人可读；public ＝ 系统内任何登录用户获得隐式访客身份（只读）。
        仅项目负责人与项目管理员可改。
      enum: [private, public]
    ProjectSettings:
      type: object
      description: 项目规则设置（主 PRD §7.9；AC-60）。按项目生效，均有默认值，仅项目管理员可改。
      required: [approvalTimeoutDays, dueSoonDays, remindDailyLimit, canEdit]
      properties:
        approvalTimeoutDays:
          type: integer
          description: 审批超时阈值 N（天），三道审批共用；审批件在当前环节等待达到 N×24 小时即超时。默认 3
        dueSoonDays:
          type: integer
          description: 临期阈值（天），指距任务截止日期的天数，用于风险等级的预警判定。默认 3
        remindDailyLimit:
          type: integer
          description: 一键提醒频次上限，同一发起人对同一被提醒人的同一任务每天可提醒次数。默认 1
        canEdit:
          type: boolean
          description: 当前用户能否修改本项目的规则设置（派生字段，仅项目管理员为 true）
    UpdateProjectSettingsRequest:
      type: object
      required: [approvalTimeoutDays, dueSoonDays, remindDailyLimit]
      properties:
        approvalTimeoutDays:
          type: integer
          minimum: 1
          maximum: 30
        dueSoonDays:
          type: integer
          minimum: 1
          maximum: 30
        remindDailyLimit:
          type: integer
          minimum: 1
          maximum: 20
    CreateProjectRequest:
      type: object
      required: [name, ownerId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        ownerId:
          type: integer
          format: int64
        stage:
          type: string
          maxLength: 50
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
    UpdateProjectRequest:
      type: object
      required: [name, ownerId, status, visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/ProjectVisibility"
        name:
          type: string
          minLength: 1
          maxLength: 100
        ownerId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ProjectStatus"
        stage:
          type: string
          maxLength: 50
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date

security:
  - cookieAuth: []
