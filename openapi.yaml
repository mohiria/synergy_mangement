      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePackageRequest"
      responses:
        "201":
          description: 已生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPackage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/packages/{packageId}/download:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: packageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: downloadPackage
      tags: [tasks]
      summary: 整包下载（AC-18）：按目录解析当前内容并流式打包为 zip
      responses:
        "200":
          description: zip 文件
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: 文件服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/report:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: range
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/ReportRange"
    get:
      operationId: getReport
      tags: [tasks]
      summary: 生成项目报告（AC-19）：今天／近 7 天／近 30 天／项目整体
      responses:
        "200":
          description: 报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/report/export:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: range
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/ReportRange"
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum: [pdf, image]
          description: pdf＝正式留档 PDF；image＝移动端长图 PNG
    get:
      operationId: exportReport
      tags: [tasks]
      summary: 导出报告（AC-20）：经 Gotenberg 渲染为正式 PDF 或移动端长图
      responses:
        "200":
          description: 导出文件
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: 渲染服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/my-work:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getMyWork
      tags: [tasks]
      summary: 我的工作五分组（AC-16）：按当前成员职责派生个人行动与等待事实
      responses:
        "200":
          description: 五分组事项
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyWork"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/import:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: importTable
      tags: [okr]
      summary: 表格导入（AC-02）：生成 O／KR 与任务草稿（仅项目管理员／项目负责人；整批一个事务）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "201":
          description: 导入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/batch-pool-submit:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: batchSubmitPool
      tags: [tasks]
      summary: 批量提交入池（AC-25；按 KR 勾选草稿任务整批提交，一个事务）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchPoolSubmitRequest"
      responses:
        "200":
          description: 已提交，返回项目最新任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/batch-pool-decision:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: batchDecidePool
      tags: [tasks]
      summary: 批量通过或退回入池审批（AC-25；每个任务须由其所属 KR 负责人处理，一个事务）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchPoolDecisionRequest"
      responses:
        "200":
          description: 已处理，返回项目最新任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/task-invites:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listTaskInvites
      tags: [task-invites]
      summary: 项目内全部任务创建邀请（含派生动作标志）
      responses:
        "200":
          description: 邀请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTaskInvites
      tags: [task-invites]
      summary: 邀请成员为某个 KR 创建任务（KR 负责人／项目管理员／项目负责人；可多选受邀成员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInvitesRequest"
      responses:
        "201":
          description: 已发出，返回项目最新的完整邀请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/task-invites/{inviteId}/revoke:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: inviteId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: revokeTaskInvite
      tags: [task-invites]
      summary: 撤回待处理的任务创建邀请（邀请人／项目管理员／项目负责人）
      responses:
        "200":
          description: 已撤回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: 全部用户（用于人员选择）
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  responses:
    Unauthorized:
      description: 未登录或会话已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 登录失败次数过多，暂时限速
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: 请求内容未通过校验
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 当前用户无权执行该动作（动作权限按成员角色在 domain 层统一判定）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与现有资源状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
        message:
          type: string
          description: 面向用户的错误说明
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
    CurrentUser:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
    UserSummary:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
    ProjectStatus:
      type: string
      description: 项目状态（未开始／进行中／已完成／已归档），与自由文本“阶段”正交
      enum: [not_started, in_progress, completed, archived]
    MemberRole:
      type: string
      description: 成员角色（项目管理员／普通成员／只读成员），见词汇表「成员角色」
      enum: [admin, member, viewer]
    ProjectMember:
      type: object
      required: [userId, username, displayName, role]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
    AddProjectMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/MemberRole"
    UpdateProjectMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"
    RiskLevel:
      type: string
      description: 风险等级（正常／预警／高风险），见词汇表「风险等级」；读时派生值，不落库、无写入路径（KR 取「下级任务未解除卡点最高等级、超期、临期」的最大值，PRD §5.7）
      enum: [normal, warning, high_risk]
    KeyResult:
      type: object
      required: [id, objectiveId, description, riskLevel, sortOrder]
      properties:
        id:
          type: integer
          format: int64
        objectiveId:
          type: integer
          format: int64
        description:
          type: string
          description: KR 描述
        metric:
          type: string
          description: 量化指标，选填
        ownerId:
          type: integer
          format: int64
          description: KR 负责人（项目成员，选填；工作职责而非权限级别）
        ownerName:
          type: string
          description: KR 负责人姓名（派生字段）
        startDate:
          type: string
          format: date
          description: 周期开始日期
        endDate:
          type: string
          format: date
          description: 周期截止日期
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        sortOrder:
          type: integer
        progressSummary:
          $ref: "#/components/schemas/ProgressSummary"
        riskNote:
          type: string
          description: 预警／高风险的一行原因（派生字段；与 riskLevel 同源，来自抬高等级的那条卡点或临期／超期事实。正常态不返回，AC-05）
        openBlockerCount:
          type: integer
          description: KR 下任务的派生卡点数量（派生字段；图谱 KR 节点展示，AC-08）
        taskCount:
          type: integer
          description: KR 下任务数量（派生字段；OKR 表「任务」列，含已完成与已取消，AC-65）
        canEdit:
          type: boolean
          description: 当前用户能否编辑本 KR（派生字段；项目管理员或本 KR 负责人，AC-65）
        canDelete:
          type: boolean
          description: 当前用户能否删除本 KR（派生字段；仅项目管理员且 KR 下无任务，AC-65）
    ImpactedTarget:
      type: object
      description: 一条受影响的 O／KR（系统推导，协作关系 PRD §8.1）
      required: [keyResultId, krDescription, objectiveId, objectiveTitle]
      properties:
        keyResultId:
          type: integer
          format: int64
        krDescription:
          type: string
        objectiveId:
          type: integer
          format: int64
        objectiveTitle:
          type: string
    ProgressSummary:
      type: object
      description: >-
        KR 层进度汇总与数据覆盖度（词汇表「进度数据覆盖度」；AC-63）：统计已入池且未取消的任务，
        已取消整体剔除；平均值任务等权、未填按 0 计入、已完成按 100
      required: [totalTasks, filledTasks]
      properties:
        totalTasks:
          type: integer
          description: 参与汇总的任务数（已入池且未取消），即平均值的分母
        filledTasks:
          type: integer
          description: 其中由负责人真实填写进度的任务数（已完成计入），说明平均值里有多少来自真实填写
        averageProgress:
          type: integer
          description: 任务等权平均（四舍五入）；未填按 0、已完成按 100 计入。没有参与汇总的任务时不返回
    UpdateTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress]
          description: 手工流转目标：开始执行（未开始／等待输入 → 进行中）；取消走 /cancellation（AC-57）
    TaskCancellationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 取消原因，必填（AC-57）
    UpdateTaskProgressRequest:
      type: object
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 省略或 null 表示清除进度，回到只展示状态
    Objective:
      type: object
      required: [id, projectId, title, sortOrder, keyResults]
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        title:
          type: string
          description: O 标题
        description:
          type: string
          description: O 说明，选填
        sortOrder:
          type: integer
        keyResults:
          type: array
          items:
            $ref: "#/components/schemas/KeyResult"
        canEdit:
          type: boolean
          description: 当前用户能否编辑本 O（派生字段；仅项目管理员，AC-65）
        canDelete:
          type: boolean
          description: 当前用户能否删除本 O（派生字段；仅项目管理员且 O 下无 KR，AC-65）
    UpdateObjectiveRequest:
      type: object
      description: 编辑 O（AC-65）：只传要改的字段
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    UpdateKeyResultRequest:
      type: object
      description: 编辑 KR（AC-61、AC-65）：只传要改的字段；ownerId 不可置空
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          type: string
          maxLength: 100
        ownerId:
          type: integer
          format: int64
          description: 新的 KR 负责人（非只读项目成员）；不可置空
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        transferPendingApprovals:
          type: boolean
          default: true
          description: >-
            更换负责人时是否把该 KR 下的未决审批单转交继任者（AC-61）。
            默认转交并向继任者发站内通知；取消勾选则保留给原负责人处理
    KrHandoverPreview:
      type: object
      description: 更换 KR 负责人前的确认信息（AC-61）：该 KR 下当前有多少未决审批单
      required: [pendingApprovals]
      properties:
        pendingApprovals:
          type: integer
          description: 待入池审批、待处理变更单与待终审完成申请的合计条数
    CreateKeyResultInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          type: string
          maxLength: 100
        ownerId:
          type: integer
          format: int64
          description: KR 负责人，必须是项目成员
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    CreateOkrBatchItem:
      type: object
      description: 二选一：填 title（可带 description）新建 O，或填 objectiveId 向已有 O 追加 KR（此时 keyResults 至少一条）
      properties:
        objectiveId:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        keyResults:
          type: array
          items:
            $ref: "#/components/schemas/CreateKeyResultInput"
    CreateOkrBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOkrBatchItem"
    TaskStatus:
      type: string
      description: 任务生命周期状态（词汇表「任务生命周期状态」）；页面主状态汇总，审批原始状态在审批单中
      enum:
        [
          draft,
          pending_pool_review,
          not_started,
          waiting_input,
          in_progress,
          pending_intermediate_review,
          pending_final_review,
          completed,
          cancelled,
        ]
    PoolReviewStatus:
      type: string
      description: 入池审批单状态（词汇表「入池审批单」）；未提交即无审批单
      enum: [pending, approved, rejected]
    PoolReview:
      type: object
      description: 任务最近一次入池审批单
      required: [status, statusLabel, exempt]
      properties:
        status:
          $ref: "#/components/schemas/PoolReviewStatus"
        statusLabel:
          type: string
          description: 面向用户的显示文案（AC-04；派生字段）：待审批为“待{所属 KR 负责人姓名}审批”，免审为“免审通过”，其余为“已通过／已退回”
        exempt:
          type: boolean
          description: KR 负责人本人创建免审时由系统自动生成并标记（AC-26）
        opinion:
          type: string
          description: 审批意见；免审时为系统记录的免审原因
        submittedByName:
          type: string
          description: 提交人姓名（派生字段）
        decidedByName:
          type: string
          description: 处理人姓名（派生字段）
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
    Task:
      type: object
      required:
        [
          id,
          keyResultId,
          name,
          ownerId,
          ownerName,
          startDate,
          endDate,
          updatedAt,
          status,
          statusLabel,
          currentStage,
          canProposeFieldChange,
          canStart,
          canUpdateProgress,
          canCancel,
          canSubmitPoolReview,
          canDecidePoolReview,
          receiverScope,
        ]
      properties:
        id:
          type: integer
          format: int64
        keyResultId:
          type: integer
          format: int64
        name:
          type: string
        ownerId:
          type: integer
          format: int64
          description: 任务负责人
        ownerName:
          type: string
          description: 任务负责人姓名（派生字段）
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        updatedAt:
          type: string
          format: date-time
          description: 任务最后更新时间（任务详情页头展示，AC-50）
        status:
          $ref: "#/components/schemas/TaskStatus"
        statusLabel:
          type: string
          description: 面向用户的状态显示文案（AC-04、决策 34；派生字段）；审批等待状态为“待{当前审批人姓名}审批”，或签多人为“待{首位姓名}等N人审批”，无审批人时退化为“待审批”
        description:
          type: string
          description: 任务说明，选填
        completionCriteria:
          type: string
          description: 完成标准，选填
        currentStage:
          type: string
          description: 当前环节（词汇表「当前环节」；中文标签，派生字段）
        pendingActorId:
          type: integer
          format: int64
          description: 待行动人（词汇表「待行动人」；派生字段，无待行动人时不返回）
        pendingActorName:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 可选进度百分比（词汇表「任务进度」）；已完成任务一律 100 且不可编辑，未填写时不返回、前端只展示状态（AC-63）
        cancelReason:
          type: string
          description: 取消原因（已取消任务保留，PRD §5.1）
        poolReview:
          $ref: "#/components/schemas/PoolReview"
        canStart:
          type: boolean
          description: 当前用户能否开始执行本任务（派生字段；负责人／可编辑项目者，未开始或等待输入时）
        canUpdateProgress:
          type: boolean
          description: 当前用户能否更新本任务进度（派生字段；负责人／可编辑项目者，仅进行中；完成后锁定为 100，AC-63）
        canCancel:
          type: boolean
          description: 当前用户能否发起取消申请（派生字段；任务负责人／项目管理员，非终态且任务上没有未决审批单，AC-57）
        fieldChange:
          $ref: "#/components/schemas/FieldChange"
          description: 最近一张需要关注的变更单（待审批＝拟议值标示，或退回未处理＝退回待处理事项）；无则不返回
        deliverableNames:
          type: array
          description: 交付物项名称列表（列表「预期交付物」列展示用，派生字段）
          items:
            type: string
        canProposeFieldChange:
          type: boolean
          description: 当前用户能否编辑任务／提交关键字段修改（派生字段）
        canManageDeliverables:
          type: boolean
          description: 当前用户能否配置任务交付物项（派生字段；负责人／创建人／可编辑项目者，非终态）
        canSubmitCompletion:
          type: boolean
          description: 当前用户能否提交完成申请（派生字段；负责人，进行中且有候选内容）
        canManageReviewers:
          type: boolean
          description: 当前用户能否调整中间审核人配置（派生字段；负责人／创建人／可编辑项目者，审核中与终态不可）
        openBlockerCount:
          type: integer
          description: 当前派生卡点数量（派生字段）
        canUploadCandidate:
          type: boolean
          description: 当前用户能否登记候选交付物内容（派生字段；负责人，执行类状态）
        canSubmitPoolReview:
          type: boolean
          description: 当前用户能否提交本任务入池（派生字段；草稿且为创建人／负责人／可编辑项目者）
        canDecidePoolReview:
          type: boolean
          description: 当前用户能否处理本任务的入池审批（派生字段；仅所属 KR 负责人）
        receiverScope:
          $ref: "#/components/schemas/ReceiverScope"
        receivers:
          type: array
          description: 指定成员为接收方时的名单（receiverScope=members；其余取值为空数组）
          items:
            $ref: "#/components/schemas/ReviewerInfo"
        canManageReceivers:
          type: boolean
          description: 当前用户能否配置接收方（派生字段；与输入／输出配置同口径：负责人／创建人／可编辑项目者，终态不可）
        canConfirmReceipt:
          type: boolean
          description: 当前用户是否有本任务的待接收项待确认（派生字段；MW-09）
    CreateTaskItem:
      type: object
      required: [keyResultId, name, ownerId, startDate, endDate]
      properties:
        keyResultId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 200
        ownerId:
          type: integer
          format: int64
          description: 任务负责人，必须是项目成员
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        expectedDeliverable:
          type: string
          maxLength: 100
          description: 预期交付物名称（选填，原型创建弹窗列）；随任务创建对应交付物项
    CreateTaskBatchRequest:
      type: object
      required: [items, submitForReview]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateTaskItem"
        submitForReview:
          type: boolean
          description: true 时保存后立即提交各自所属 KR 的入池审批（原型「提交入池审批」按钮）；KR 负责人本人创建的任务始终免审直接进入未开始
        taskInviteId:
          type: integer
          format: int64
          description: 通过任务创建邀请响应时携带（AC-03）；须为发给当前用户的待处理邀请，且本批至少一项任务属于邀请指定的 KR 并提交入池，成功后邀请变为已完成
    TaskDetail:
      type: object
      description: 任务详情抽屉数据（AC-31／AC-34）：任务事实、O／KR 归属与全部审核记录
      required:
        [
          task,
          objectiveTitle,
          krDescription,
          poolReviews,
          fieldChanges,
          impactedTargets,
          deliverables,
          discussions,
          completionReviews,
          reviewers,
          blockers,
          inputs,
          outputs,
          upstream,
          downstream,
          activities,
          receipts,
        ]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        objectiveTitle:
          type: string
          description: 所属 O 标题（派生字段）
        krDescription:
          type: string
          description: 所属 KR 描述（派生字段）
        poolReviews:
          type: array
          description: 入池审批记录，最新在前（词汇表「审核记录」）
          items:
            $ref: "#/components/schemas/PoolReview"
        fieldChanges:
          type: array
          description: 关键字段变更单记录，最新在前（词汇表「关键字段变更单」）
          items:
            $ref: "#/components/schemas/FieldChange"
        deliverables:
          type: array
          description: 交付物项列表（含当前内容与候选审核提示，AC-32／AC-33）
          items:
            $ref: "#/components/schemas/Deliverable"
        discussions:
          type: array
          description: 任务讨论意见，按时间正序（AC-35／AC-36）
          items:
            $ref: "#/components/schemas/Discussion"
        completionReviews:
          type: array
          description: 完成申请记录，最新在前（AC-13／AC-15／AC-38～40）
          items:
            $ref: "#/components/schemas/CompletionReview"
        reviewers:
          type: array
          description: 任务级中间审核人配置（或签组；提交完成申请时快照进申请）
          items:
            $ref: "#/components/schemas/ReviewerInfo"
        blockers:
          type: array
          description: 本任务当前派生的结构化卡点（AC-11）
          items:
            $ref: "#/components/schemas/Blocker"
        inputs:
          type: array
          description: 指向本任务的交付物边（必要输入与参考输入，AC-07／28）
          items:
            $ref: "#/components/schemas/DeliverableEdge"
        outputs:
          type: array
          description: 从本任务出发的交付物边（直接下游）
          items:
            $ref: "#/components/schemas/DeliverableEdge"
        impactedTargets:
          type: array
          description: >-
            受影响 O／KR（系统推导；协作关系 PRD §8.1）：从本任务出发沿下游硬前置交付物边传递闭包，
            收集途经任务所属的 KR 及其 O。反馈、参考输入与普通双向协作不计入；不含本任务所属 KR
          items:
            $ref: "#/components/schemas/ImpactedTarget"
        upstream:
          type: array
          description: 协作关系摘要——直接上游分组（词汇表；派生字段，无关系时为空数组，前端按空组隐藏）
          items:
            $ref: "#/components/schemas/TaskRelation"
        downstream:
          type: array
          description: 协作关系摘要——直接下游分组（词汇表；派生字段，无关系时为空数组，前端按空组隐藏）
          items:
            $ref: "#/components/schemas/TaskRelation"
        activities:
          type: array
          description: 任务动态，最新在前（词汇表「任务动态」；ADR 0002）
          items:
            $ref: "#/components/schemas/TaskActivity"
        receipts:
          type: array
          description: 待接收项与接收记录（词汇表「接收记录」；终审通过后按当时接收方名单逐人生成，MW-09）
          items:
            $ref: "#/components/schemas/TaskReceipt"
    TaskActivityKind:
      type: string
      description: 任务动态类型（ADR 0002）；blocker_* 为系统派生，无行动人
      enum:
        [
          pool_submitted,
          pool_approved,
          pool_rejected,
          field_change_submitted,
          field_change_approved,
          field_change_rejected,
          field_change_abandoned,
          completion_submitted,
          completion_approved,
          completion_rejected,
          receipt_confirmed,
          blocker_opened,
          blocker_resolved,
        ]
    TaskActivity:
      type: object
      description: 任务动态的一条事实（词汇表「任务动态」）：已经发生、不可撤销，只记录不派生，不可编辑或删除
      required: [id, kind, kindLabel, summary, occurredAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/TaskActivityKind"
        kindLabel:
          type: string
          description: 动态类型的中文名（派生字段）；行级显示消费本字段，前端不按枚举拼文案
        actorName:
          type: string
          description: 行动人姓名（派生字段）；系统派生事件不返回
        summary:
          type: string
          description: 面向用户的一句话，写入时定型；退回类动态带上一句话理由
        occurredAt:
          type: string
          format: date-time
    TaskRelation:
      type: object
      description: 协作关系摘要中的一条直接协作关系（词汇表「协作关系摘要」；PRD §7.5）；不插入交付物中间节点，同一对方任务同一关系类型合并为一条
      required: [taskId, taskName, krDescription, edgeType, ownerName, taskStatusLabel, ready]
      properties:
        taskId:
          type: integer
          format: int64
          description: 对方任务
        taskName:
          type: string
        krDescription:
          type: string
          description: 对方任务所属 KR 描述（派生字段）
        edgeType:
          $ref: "#/components/schemas/EdgeType"
        ownerName:
          type: string
          description: 对方任务负责人姓名（派生字段）
        taskStatusLabel:
          type: string
          description: 对方任务状态显示文案（AC-04；派生字段）
        ready:
          type: boolean
          description: 该关系是否就绪（AC-48；合并后全部边就绪才为真）
    FieldChangeState:
      type: string
      enum: [pending, approved, rejected]
    FieldChangeDiff:
      type: object
      description: 单个关键字段的修改前后差异（展示用字符串）
      required: [field, label, oldValue, newValue]
      properties:
        field:
          type: string
          description: 字段名（name／description／completionCriteria／ownerId／endDate）
        label:
          type: string
          description: 中文字段名（派生字段）
        oldValue:
          type: string
        newValue:
          type: string
    FieldChangeType:
      type: string
      description: >-
        变更类型（PRD §5.2.B）：关键字段修改（标题／说明／量化标准／负责人／截止时间）、
        结构变更（输入、输入源、输出、接收方）或任务取消申请，三者复用同一张变更单
      enum: [key_fields, structure, cancel]
    FieldChange:
      type: object
      description: 关键字段变更单（词汇表）；rejected 且 resolved=false 即「退回待处理事项」
      required: [id, changeType, state, stateLabel, reason, resolved, exempt, changes]
      properties:
        id:
          type: integer
          format: int64
        changeType:
          $ref: "#/components/schemas/FieldChangeType"
        state:
          $ref: "#/components/schemas/FieldChangeState"
        stateLabel:
          type: string
          description: 面向用户的显示文案（AC-04；派生字段）：待审批为“待{所属 KR 负责人姓名}审批”，免审为“免审生效”，其余为“已通过／已退回”
        reason:
          type: string
          description: 修改原因
        opinion:
          type: string
          description: 审批意见
        resolved:
          type: boolean
          description: 退回后是否已处理（重新提交或放弃）
        exempt:
          type: boolean
          description: KR 负责人本人修改免审即时生效时由系统标记
        changes:
          type: array
          items:
            $ref: "#/components/schemas/FieldChangeDiff"
        submittedById:
          type: integer
          format: int64
        submittedByName:
          type: string
        decidedByName:
          type: string
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        canDecide:
          type: boolean
          description: 当前用户能否处理本变更单（派生字段；仅所属 KR 负责人且待审批）
        canAbandon:
          type: boolean
          description: 当前用户能否放弃本次变更（派生字段；退回未处理且为提交人／可编辑项目者）
    SubmitFieldChangeRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: object
          description: 拟议值；至少一项。草稿任务直接生效；KR 负责人改本人 KR 下任务免审即时生效
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            description:
              type: string
              maxLength: 2000
            completionCriteria:
              type: string
              maxLength: 2000
            ownerId:
              type: integer
              format: int64
            endDate:
              type: string
              format: date
        reason:
          type: string
          maxLength: 500
          description: 修改原因；进入审批（含免审留痕）时必填，草稿直接完善可不填
    FieldChangeDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        opinion:
          type: string
          maxLength: 500
    CommitUploadRequest:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: integer
          format: int64
          description: 第一步返回的内容记录 id
    DeliverableFile:
      type: object
      description: 交付物内容（词汇表「交付物」；当前已生效或候选审核中）
      required: [id, state, fileName]
      properties:
        id:
          type: integer
          format: int64
        state:
          type: string
          enum: [current, candidate, uploading]
          description: uploading 表示已建记录但文件尚未确认写入对象存储，未确认前不参与就绪判定
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
          format: int64
          description: 字节数
        uploadedByName:
          type: string
          description: 提交人姓名（派生字段）
        uploadedAt:
          type: string
          format: date-time
        effectiveAt:
          type: string
          format: date-time
          description: 当前内容的生效时间（终审通过时刻）
    Deliverable:
      type: object
      description: 交付物项：至多一份当前内容与一份候选内容，无版本号与历史（PRD §5.3）
      required: [id, taskId, name]
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        name:
          type: string
        current:
          $ref: "#/components/schemas/DeliverableFile"
        candidate:
          $ref: "#/components/schemas/DeliverableFile"
          description: 审核中的候选内容；任务概况只提示不展示内容（AC-33）
    CreateDeliverableRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    UploadCandidateRequest:
      type: object
      required: [fileName]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 200
        fileType:
          type: string
          maxLength: 100
        fileSize:
          type: integer
          format: int64
    UploadCandidateResponse:
      type: object
      required: [file, uploadUrl]
      properties:
        file:
          $ref: "#/components/schemas/DeliverableFile"
        uploadUrl:
          type: string
          description: MinIO 预签名 PUT 地址，客户端直接上传文件内容
    DownloadUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: MinIO 预签名 GET 地址（预览/下载）
    Discussion:
      type: object
      description: 任务讨论意见（词汇表「任务讨论」）；提交后不可编辑或删除
      required: [id, taskId, authorId, authorName, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        authorName:
          type: string
        content:
          type: string
        mentionNames:
          type: array
          description: 被 @ 成员姓名（派生字段）
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    CreateDiscussionRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        mentionUserIds:
          type: array
          description: 被 @ 的项目成员
          items:
            type: integer
            format: int64
    Notification:
      type: object
      description: 站内通知（词汇表「站内通知」）
      required: [id, kind, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: 通知类型（discussion_mention／discussion_owner 等）
        content:
