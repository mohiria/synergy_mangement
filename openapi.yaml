openapi: 3.0.3
info:
  title: 协同管理工具 API
  version: 0.1.0
  description: |
    Spec-first 唯一契约源。
    Go 侧用 oapi-codegen 生成 server 接口与模型，前端用 openapi-typescript + openapi-fetch 生成类型化客户端；生成物不手改。
    业务规则只在后端 domain 包实现，界面反馈一律消费本契约返回的派生字段。
servers:
  - url: /api/v1
tags:
  - name: system
    description: 系统状态
  - name: auth
    description: 本地账号登录与会话（bcrypt + HttpOnly Cookie）
  - name: projects
    description: 项目列表、创建项目与项目切换（多项目 V1 范围）
  - name: okr
    description: O／KR 层级的建立与查询（表格式创建，AC-01）
  - name: users
    description: 用户目录（人员选择用）
  - name: tasks
    description: 任务的创建、入池审批与 KR 负责人免审（AC-04、AC-26）
  - name: task-invites
    description: 任务创建邀请（AC-03；词汇表「任务创建邀请」）

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 登录，成功后通过 HttpOnly Cookie 建立会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 退出登录，销毁当前会话
      responses:
        "204":
          description: 已退出

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: 当前登录用户
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: 当前用户可见的项目列表
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: 单个项目详情（项目内页面外壳用）
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProject
      tags: [projects]
      summary: 更新项目（全量字段）
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/members:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listProjectMembers
      tags: [projects]
      summary: 项目成员列表（含成员角色）
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addProjectMember
      tags: [projects]
      summary: 将用户加入项目并赋予成员角色（仅项目管理员／项目负责人）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMemberRequest"
      responses:
        "201":
          description: 已加入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/members/{userId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updateProjectMemberRole
      tags: [projects]
      summary: 调整成员角色（仅项目管理员／项目负责人）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRoleRequest"
      responses:
        "200":
          description: 已调整
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: 将成员移出项目（仅项目管理员／项目负责人）
      responses:
        "204":
          description: 已移出
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/objectives:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listObjectives
      tags: [okr]
      summary: 项目的 O／KR 层级列表（O 含下属 KR，按排序返回）
      responses:
        "200":
          description: O 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objective"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createOkrBatch
      tags: [okr]
      summary: 表格式批量创建 O／KR（仅项目管理员／项目负责人；整批一个事务，全部成功或全部失败）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOkrBatchRequest"
      responses:
        "201":
          description: 创建成功，返回项目最新的完整 O／KR 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objective"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listTasks
      tags: [tasks]
      summary: 项目全部任务（含派生动作标志与最近一次入池审批单）
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTaskBatch
      tags: [tasks]
      summary: 表格式批量创建任务草稿（可选一并提交入池；KR 负责人本人创建免审直接进入未开始，AC-26）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBatchRequest"
      responses:
        "201":
          description: 创建成功，返回项目最新的完整任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}/submit-pool-review:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: submitTaskPoolReview
      tags: [tasks]
      summary: 将草稿任务提交所属 KR 负责人入池审批（AC-04；退回后可修改重新提交）
      responses:
        "200":
          description: 已提交，任务进入待入池审批
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}/pool-review-decision:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: decideTaskPoolReview
      tags: [tasks]
      summary: 所属 KR 负责人通过或退回入池审批（AC-04；管理员不能替代 KR 负责人）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolReviewDecisionRequest"
      responses:
        "200":
          description: 已处理，返回任务最新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}/update-status:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: updateTaskStatus
      tags: [tasks]
      summary: 手工流转任务状态：开始执行或取消（AC-12；完成走三道审批，不在此端点）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskStatusRequest"
      responses:
        "200":
          description: 已流转，返回任务最新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}/progress:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updateTaskProgress
      tags: [tasks]
      summary: 更新或清除任务的可选进度百分比（AC-12；系统不产生虚构百分比）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskProgressRequest"
      responses:
        "200":
          description: 已更新，返回任务最新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/task-invites:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listTaskInvites
      tags: [task-invites]
      summary: 项目内全部任务创建邀请（含派生动作标志）
      responses:
        "200":
          description: 邀请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTaskInvites
      tags: [task-invites]
      summary: 邀请成员为某个 KR 创建任务（KR 负责人／项目管理员／项目负责人；可多选受邀成员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInvitesRequest"
      responses:
        "201":
          description: 已发出，返回项目最新的完整邀请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/task-invites/{inviteId}/revoke:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: inviteId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: revokeTaskInvite
      tags: [task-invites]
      summary: 撤回待处理的任务创建邀请（邀请人／项目管理员／项目负责人）
      responses:
        "200":
          description: 已撤回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: 全部用户（用于人员选择）
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  responses:
    Unauthorized:
      description: 未登录或会话已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 登录失败次数过多，暂时限速
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: 请求内容未通过校验
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 当前用户无权执行该动作（动作权限按成员角色在 domain 层统一判定）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与现有资源状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
        message:
          type: string
          description: 面向用户的错误说明
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
    CurrentUser:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
    UserSummary:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
    ProjectStatus:
      type: string
      description: 项目状态（未开始／进行中／已完成／已归档），与自由文本“阶段”正交
      enum: [not_started, in_progress, completed, archived]
    MemberRole:
      type: string
      description: 成员角色（项目管理员／普通成员／只读成员），见词汇表「成员角色」
      enum: [admin, member, viewer]
    ProjectMember:
      type: object
      required: [userId, username, displayName, role]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
    AddProjectMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/MemberRole"
    UpdateProjectMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"
    RiskLevel:
      type: string
      description: 风险等级（正常／预警／高风险），见词汇表「风险等级」；不由任务生命周期状态自动推导
      enum: [normal, warning, high_risk]
    KeyResult:
      type: object
      required: [id, objectiveId, description, riskLevel, sortOrder]
      properties:
        id:
          type: integer
          format: int64
        objectiveId:
          type: integer
          format: int64
        description:
          type: string
          description: KR 描述
        metric:
          type: string
          description: 量化指标，选填
        ownerId:
          type: integer
          format: int64
          description: KR 负责人（项目成员，选填；工作职责而非权限级别）
        ownerName:
          type: string
          description: KR 负责人姓名（派生字段）
        startDate:
          type: string
          format: date
          description: 周期开始日期
        endDate:
          type: string
          format: date
          description: 周期截止日期
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        sortOrder:
          type: integer
        progressSummary:
          $ref: "#/components/schemas/ProgressSummary"
    ProgressSummary:
      type: object
      description: KR 层进度数据覆盖度（词汇表「进度数据覆盖度」）；只统计已入池且未取消的任务，平均值任务等权
      required: [totalTasks, filledTasks]
      properties:
        totalTasks:
          type: integer
        filledTasks:
          type: integer
        averageProgress:
          type: integer
          description: 已填写任务的等权平均（四舍五入）；无已填任务时不返回
    UpdateTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, cancelled]
          description: 手工流转目标：开始执行（未开始／等待输入 → 进行中）或取消（非终态 → 已取消，需原因）
        reason:
          type: string
          maxLength: 500
          description: 取消原因；status 为 cancelled 时必填
    UpdateTaskProgressRequest:
      type: object
      properties:
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 省略或 null 表示清除进度，回到只展示状态
    Objective:
      type: object
      required: [id, projectId, title, sortOrder, keyResults]
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        title:
          type: string
          description: O 标题
        description:
          type: string
          description: O 说明，选填
        sortOrder:
          type: integer
        keyResults:
          type: array
          items:
            $ref: "#/components/schemas/KeyResult"
    CreateKeyResultInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          type: string
          maxLength: 100
        ownerId:
          type: integer
          format: int64
          description: KR 负责人，必须是项目成员
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    CreateOkrBatchItem:
      type: object
      description: 二选一：填 title（可带 description）新建 O，或填 objectiveId 向已有 O 追加 KR（此时 keyResults 至少一条）
      properties:
        objectiveId:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        keyResults:
          type: array
          items:
            $ref: "#/components/schemas/CreateKeyResultInput"
    CreateOkrBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOkrBatchItem"
    TaskStatus:
      type: string
      description: 任务生命周期状态（词汇表「任务生命周期状态」）；页面主状态汇总，审批原始状态在审批单中
      enum:
        [
          draft,
          pending_pool_review,
          not_started,
          waiting_input,
          in_progress,
          pending_intermediate_review,
          pending_final_review,
          completed,
          cancelled,
        ]
    PoolReviewStatus:
      type: string
      description: 入池审批单状态（词汇表「入池审批单」）；未提交即无审批单
      enum: [pending, approved, rejected]
    PoolReview:
      type: object
      description: 任务最近一次入池审批单
      required: [status, exempt]
      properties:
        status:
          $ref: "#/components/schemas/PoolReviewStatus"
        exempt:
          type: boolean
          description: KR 负责人本人创建免审时由系统自动生成并标记（AC-26）
        opinion:
          type: string
          description: 审批意见；免审时为系统记录的免审原因
        submittedByName:
          type: string
          description: 提交人姓名（派生字段）
        decidedByName:
          type: string
          description: 处理人姓名（派生字段）
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
    Task:
      type: object
      required:
        [
          id,
          keyResultId,
          name,
          ownerId,
          ownerName,
          startDate,
          endDate,
          status,
          canStart,
          canUpdateProgress,
          canCancel,
          canSubmitPoolReview,
          canDecidePoolReview,
        ]
      properties:
        id:
          type: integer
          format: int64
        keyResultId:
          type: integer
          format: int64
        name:
          type: string
        ownerId:
          type: integer
          format: int64
          description: 任务负责人
        ownerName:
          type: string
          description: 任务负责人姓名（派生字段）
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/TaskStatus"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 可选进度百分比（词汇表「任务进度」）；未填写时不返回，前端只展示状态
        cancelReason:
          type: string
          description: 取消原因（已取消任务保留，PRD §5.1）
        poolReview:
          $ref: "#/components/schemas/PoolReview"
        canStart:
          type: boolean
          description: 当前用户能否开始执行本任务（派生字段；负责人／可编辑项目者，未开始或等待输入时）
        canUpdateProgress:
          type: boolean
          description: 当前用户能否更新本任务进度（派生字段；负责人／可编辑项目者，执行中状态）
        canCancel:
          type: boolean
          description: 当前用户能否取消本任务（派生字段；负责人／创建人／可编辑项目者，非终态）
        canSubmitPoolReview:
          type: boolean
          description: 当前用户能否提交本任务入池（派生字段；草稿且为创建人／负责人／可编辑项目者）
        canDecidePoolReview:
          type: boolean
          description: 当前用户能否处理本任务的入池审批（派生字段；仅所属 KR 负责人）
    CreateTaskItem:
      type: object
      required: [keyResultId, name, ownerId, startDate, endDate]
      properties:
        keyResultId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 200
        ownerId:
          type: integer
          format: int64
          description: 任务负责人，必须是项目成员
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    CreateTaskBatchRequest:
      type: object
      required: [items, submitForReview]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateTaskItem"
        submitForReview:
          type: boolean
          description: true 时保存后立即提交各自所属 KR 的入池审批（原型「提交入池审批」按钮）；KR 负责人本人创建的任务始终免审直接进入未开始
        taskInviteId:
          type: integer
          format: int64
          description: 通过任务创建邀请响应时携带（AC-03）；须为发给当前用户的待处理邀请，且本批至少一项任务属于邀请指定的 KR 并提交入池，成功后邀请变为已完成
    TaskInviteState:
      type: string
      description: 任务创建邀请状态（词汇表「任务创建邀请」）
      enum: [pending, completed, revoked]
    TaskInvite:
      type: object
      required: [id, keyResultId, inviterId, inviterName, inviteeId, inviteeName, state, createdAt, canHandle, canRevoke]
      properties:
        id:
          type: integer
          format: int64
        keyResultId:
          type: integer
          format: int64
        inviterId:
          type: integer
          format: int64
        inviterName:
          type: string
          description: 邀请人姓名（派生字段）
        inviteeId:
          type: integer
          format: int64
        inviteeName:
          type: string
          description: 受邀成员姓名（派生字段）
        note:
          type: string
          description: 邀请说明
        state:
          $ref: "#/components/schemas/TaskInviteState"
        createdAt:
          type: string
          format: date-time
        canHandle:
          type: boolean
          description: 当前用户能否响应本邀请（派生字段；受邀人且待处理）
        canRevoke:
          type: boolean
          description: 当前用户能否撤回本邀请（派生字段；邀请人／项目管理员／项目负责人且待处理）
    CreateTaskInvitesRequest:
      type: object
      required: [keyResultId, inviteeIds]
      properties:
        keyResultId:
          type: integer
          format: int64
        inviteeIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          description: 受邀成员（可多选；须为非只读项目成员，不能邀请自己）
        note:
          type: string
          maxLength: 500
          description: 邀请说明，随站内通知一同展示
    PoolReviewDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        opinion:
          type: string
          maxLength: 500
    Project:
      type: object
      required: [id, name, ownerId, ownerName, status, createdAt, canEdit, canManageMembers]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        ownerId:
          type: integer
          format: int64
          description: 项目负责人（单人；与项目管理员为独立角色）
        ownerName:
          type: string
          description: 项目负责人姓名（派生字段，前端直接展示）
        status:
          $ref: "#/components/schemas/ProjectStatus"
        stage:
          type: string
          description: 业务里程碑标签，自由文本，选填
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        canEdit:
          type: boolean
          description: 当前用户能否编辑本项目（派生字段，按成员角色与项目负责人身份在 domain 层判定）
        canManageMembers:
          type: boolean
          description: 当前用户能否管理本项目成员和权限（派生字段，同上）
    CreateProjectRequest:
      type: object
      required: [name, ownerId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        ownerId:
          type: integer
          format: int64
        stage:
          type: string
          maxLength: 50
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
    UpdateProjectRequest:
      type: object
      required: [name, ownerId, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        ownerId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ProjectStatus"
        stage:
          type: string
          maxLength: 50
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date

security:
  - cookieAuth: []
