        userIds:
          type: array
          description: scope=members 时的接收方名单（至少一人，须为项目成员）；其余取值忽略
          items:
            type: integer
            format: int64
    SetReviewersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          description: 中间审核人（或签组；可为空表示不配置）；须为非只读项目成员
          items:
            type: integer
            format: int64
    CompletionReview:
      type: object
      description: 完成申请（词汇表）；整体通过或整体退回
      required: [id, state, stateLabel, note, items]
      properties:
        id:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/CompletionReviewState"
        stateLabel:
          type: string
          description: 面向用户的显示文案（AC-04；派生字段）：中间或签为“待{审核人姓名}审批”（多人为“待{首位姓名}等N人审批”），待终审为“待{所属 KR 负责人姓名}审批”，其余为“已通过／已退回”
        note:
          type: string
          description: 提交说明
        opinion:
          type: string
          description: 审核意见；退回意见必填（AC-38）
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompletionReviewItem"
        submittedByName:
          type: string
        decidedByName:
          type: string
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        reviewers:
          type: array
          description: 中间审核组快照（或签；AC-14）
          items:
            $ref: "#/components/schemas/ReviewerInfo"
        intermediateByName:
          type: string
          description: 或签通过的处理人姓名（派生字段）
        intermediateAt:
          type: string
          format: date-time
        intermediateOpinion:
          type: string
        canDecide:
          type: boolean
          description: 当前用户能否处理本申请（派生字段；中间审核中为或签组成员，待 KR 终审时仅所属 KR 负责人，AC-37）
    SubmitCompletionRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: 提交说明（§9.1 必填）
    CompletionDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        opinion:
          type: string
          maxLength: 500
          description: 通过意见选填，退回意见必填（AC-38）
    TaskInviteState:
      type: string
      description: 任务创建邀请状态（词汇表「任务创建邀请」）
      enum: [pending, completed, revoked]
    TaskInvite:
      type: object
      required: [id, keyResultId, inviterId, inviterName, inviteeId, inviteeName, state, createdAt, canHandle, canRevoke]
      properties:
        id:
          type: integer
          format: int64
        keyResultId:
          type: integer
          format: int64
        inviterId:
          type: integer
          format: int64
        inviterName:
          type: string
          description: 邀请人姓名（派生字段）
        inviteeId:
          type: integer
          format: int64
        inviteeName:
          type: string
          description: 受邀成员姓名（派生字段）
        note:
          type: string
          description: 邀请说明
        state:
          $ref: "#/components/schemas/TaskInviteState"
        createdAt:
          type: string
          format: date-time
        canHandle:
          type: boolean
          description: 当前用户能否响应本邀请（派生字段；受邀人且待处理）
        canRevoke:
          type: boolean
          description: 当前用户能否撤回本邀请（派生字段；邀请人／项目管理员／项目负责人且待处理）
    CreateTaskInvitesRequest:
      type: object
      required: [keyResultId, inviteeIds]
      properties:
        keyResultId:
          type: integer
          format: int64
        inviteeIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          description: 受邀成员（可多选；须为非只读项目成员，不能邀请自己）
        note:
          type: string
          maxLength: 500
          description: 邀请说明，随站内通知一同展示
    PoolReviewDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        opinion:
          type: string
          maxLength: 500
    Project:
      type: object
      required: [id, name, ownerId, ownerName, status, createdAt, canEdit, canManageMembers]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        ownerId:
          type: integer
          format: int64
          description: 项目负责人（单人；与项目管理员为独立角色）
        ownerName:
          type: string
          description: 项目负责人姓名（派生字段，前端直接展示）
        status:
          $ref: "#/components/schemas/ProjectStatus"
        stage:
          type: string
          description: 业务里程碑标签，自由文本，选填
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        canEdit:
          type: boolean
          description: 当前用户能否编辑本项目（派生字段，按成员角色与项目负责人身份在 domain 层判定）
        canManageMembers:
          type: boolean
          description: 当前用户能否管理本项目成员和权限（派生字段，同上）
    ProjectSettings:
      type: object
      description: 项目规则设置（主 PRD §7.9；AC-60）。按项目生效，均有默认值，仅项目管理员可改。
      required: [approvalTimeoutDays, dueSoonDays, remindDailyLimit, canEdit]
      properties:
        approvalTimeoutDays:
          type: integer
          description: 审批超时阈值 N（天），三道审批共用；审批件在当前环节等待达到 N×24 小时即超时。默认 3
        dueSoonDays:
          type: integer
          description: 临期阈值（天），指距任务截止日期的天数，用于风险等级的预警判定。默认 3
        remindDailyLimit:
          type: integer
          description: 一键提醒冷却，同一发起人对同一被提醒人的同一任务每天可提醒次数。默认 1
        canEdit:
          type: boolean
          description: 当前用户能否修改本项目的规则设置（派生字段，仅项目管理员为 true）
    UpdateProjectSettingsRequest:
      type: object
      required: [approvalTimeoutDays, dueSoonDays, remindDailyLimit]
      properties:
        approvalTimeoutDays:
          type: integer
          minimum: 1
          maximum: 30
        dueSoonDays:
          type: integer
          minimum: 1
          maximum: 30
        remindDailyLimit:
          type: integer
          minimum: 1
          maximum: 20
    CreateProjectRequest:
      type: object
      required: [name, ownerId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        ownerId:
          type: integer
          format: int64
        stage:
          type: string
          maxLength: 50
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
    UpdateProjectRequest:
      type: object
      required: [name, ownerId, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        ownerId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ProjectStatus"
        stage:
          type: string
          maxLength: 50
        plannedStartDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date

security:
  - cookieAuth: []
