openapi: 3.0.3
info:
  title: 协同管理工具 API
  version: 0.1.0
  description: |
    Spec-first 唯一契约源。
    Go 侧用 oapi-codegen 生成 server 接口与模型，前端用 openapi-typescript + openapi-fetch 生成类型化客户端；生成物不手改。
    业务规则只在后端 domain 包实现，界面反馈一律消费本契约返回的派生字段。
servers:
  - url: /api/v1
tags:
  - name: system
    description: 系统状态
  - name: auth
    description: 本地账号登录与会话（bcrypt + HttpOnly Cookie）
  - name: projects
    description: 项目列表、创建项目与项目切换（多项目 V1 范围）
  - name: okr
    description: O／KR 层级的建立与查询（表格式创建，AC-01）
  - name: users
    description: 用户目录（人员选择用）
  - name: tasks
    description: 任务的创建、入池审批与 KR 负责人免审（AC-04、AC-26）
  - name: task-invites
    description: 任务创建邀请（AC-03；词汇表「任务创建邀请」）
  - name: discussions
    description: 任务讨论与站内通知（AC-35、AC-36）

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 登录，成功后通过 HttpOnly Cookie 建立会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 退出登录，销毁当前会话
      responses:
        "204":
          description: 已退出

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: 修改本人登录口令（S3）；改完除当前会话外，本人其余会话全部失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 已修改，其余会话已吊销
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: 当前登录用户
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: 当前用户可见的项目列表
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: 创建项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: 单个项目详情（项目内页面外壳用）
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProject
      tags: [projects]
      summary: 更新项目（全量字段）
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/settings:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getProjectSettings
      tags: [projects]
      summary: 项目规则设置（审批超时阈值、临期阈值、一键提醒频次上限）
      responses:
        "200":
          description: 规则设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProjectSettings
      tags: [projects]
      summary: 修改项目规则设置（仅项目管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectSettingsRequest"
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/members:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listProjectMembers
      tags: [projects]
      summary: 项目成员列表（含成员角色）
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addProjectMembers
      tags: [projects]
      summary: 将一名或多名用户加入项目并赋予同一成员角色（仅项目管理员／项目负责人）
      description: |
        一次提交建立全部成员关系并返回逐人结果：已在项目内或用户不存在的按人跳过，
        不牵连名单里的其余人；名单为空或角色不合法整批拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMembersRequest"
      responses:
        "201":
          description: 已处理（逐人结果见响应体，added 可能为空）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddProjectMembersResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/members/{userId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updateProjectMemberRole
      tags: [projects]
      summary: 调整成员角色（仅项目管理员／项目负责人）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRoleRequest"
      responses:
        "200":
          description: 已调整
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: 将成员移出项目（仅项目管理员／项目负责人；此人仍在担任 KR 负责人、任务负责人、中间审核人、接收方或输入对接人时返回 409 并列出待交接项，AC-61）
      responses:
        "204":
          description: 已移出
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{projectId}/objectives:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listObjectives
      tags: [okr]
      summary: 项目的 O／KR 层级列表（O 含下属 KR，按排序返回）
      responses:
        "200":
          description: O 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objective"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createOkrBatch
      tags: [okr]
      summary: 表格式批量创建 O／KR（仅项目管理员／项目负责人；整批一个事务，全部成功或全部失败）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOkrBatchRequest"
      responses:
        "201":
          description: 创建成功，返回项目最新的完整 O／KR 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objective"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/objectives/{objectiveId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: objectiveId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateObjective
      tags: [okr]
      summary: 编辑 O（AC-65；仅项目管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObjectiveRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteObjective
      tags: [okr]
      summary: 删除 O（AC-65；仅项目管理员，且 O 下没有 KR）
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{projectId}/key-results/{keyResultId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: keyResultId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getKrHandoverPreview
      tags: [okr]
      summary: 更换 KR 负责人前的确认信息（AC-61；返回该 KR 下未决审批单条数）
      responses:
        "200":
          description: 未决审批单条数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KrHandoverPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateKeyResult
      tags: [okr]
      summary: 编辑 KR（AC-61、AC-65；项目管理员或本 KR 负责人；负责人不可置空，更换时可转交未决审批）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKeyResultRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteKeyResult
      tags: [okr]
      summary: 删除 KR（AC-65；仅项目管理员，且 KR 下没有任务，含已完成与已取消）
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{projectId}/tasks:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listTasks
      tags: [tasks]
      summary: 项目任务（含派生动作标志与最近一次入池审批单）；支持服务端裁剪，避免大项目整表下发
      parameters:
        - name: krId
          in: query
          description: 只返回该 KR 下的任务（服务端裁剪，P1）
          schema:
            type: integer
            format: int64
        - name: includeCompleted
          in: query
          description: 是否包含已完成任务；缺省为 true（与既有「显示已完成」开关同口径，已取消一律返回）
          schema:
            type: boolean
        - name: limit
          in: query
          description: 最多返回条数；缺省不限
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTaskBatch
      tags: [tasks]
      summary: 表格式批量创建任务草稿（可选一并提交入池；KR 负责人本人创建免审直接进入未开始，AC-26）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBatchRequest"
      responses:
        "201":
          description: 创建成功，返回项目最新的完整任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}/submit-pool-review:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: submitTaskPoolReview
      tags: [tasks]
      summary: 将草稿任务提交所属 KR 负责人入池审批（AC-04；退回后可修改重新提交）
      responses:
        "200":
          description: 已提交，任务进入待入池审批
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}/pool-review-decision:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: decideTaskPoolReview
      tags: [tasks]
      summary: 所属 KR 负责人通过或退回入池审批（AC-04；管理员不能替代 KR 负责人）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolReviewDecisionRequest"
      responses:
        "200":
          description: 已处理，返回任务最新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getTaskDetail
      tags: [tasks]
      summary: 任务详情（AC-31／AC-34；全体项目成员可查看，操作按钮按派生权限标志出现）
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/tasks/{taskId}/update-status:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: updateTaskStatus
      tags: [tasks]
      summary: 手工流转任务状态：开始执行（AC-12；完成走三道审批、取消走取消申请，均不在此端点）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskStatusRequest"
      responses:
        "200":
          description: 已流转，返回任务最新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}/progress:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      operationId: updateTaskProgress
      tags: [tasks]
      summary: 更新或清除任务的可选进度百分比（AC-12；系统不产生虚构百分比）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskProgressRequest"
      responses:
        "200":
          description: 已更新，返回任务最新状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/tasks/{taskId}/cancellation:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: requestTaskCancellation
      tags: [tasks]
      summary: 发起任务取消申请（AC-57；复用关键字段变更单，进所属 KR 负责人待我审批，KR 负责人本人免审即时生效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCancellationRequest"
      responses:
        "200":
