# sqlc 配置：schema 读 goose 迁移（Down 段自动忽略），查询写在 internal/store/queries/
# 执行：go tool sqlc generate
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: false
